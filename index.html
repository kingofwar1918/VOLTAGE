<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voltage</title>
<meta name="description" content="Voltage – Planspiel für den WAH-Unterricht: Gruppen führen eine Energy-Drink-Firma wirtschaftlich, ökologisch und sozial.">
<meta name="theme-color" content="#0B0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Voltage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* =====================================================================
   FARBEN & MASSE – helles Schema als Grundlage, dunkles darunter
   ===================================================================== */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --raised:#F5F7FC; --sunk:#E6EAF3;
  --line:#D3DAE8; --line-strong:#AEB8CF;
  --ink:#0B0E1A; --muted:#515B75;
  --volt:#C6F53C; --volt-ink:#0B0E1A; --volt-text:#3F6B0A;
  --cyan:#0B7A8A; --magenta:#C3134B; --amber:#A35A00;
  --pos:#157A3A; --neg:#C22727; --warn:#9A5200;
  --pos-bg:#E3F5E9; --neg-bg:#FCE9E9; --warn-bg:#FFF1DB; --info-bg:#E2F4F7;
  --dim-w:#2458D6; --dim-u:#138A3E; --dim-g:#C2410C;
  --halo:rgba(11,14,26,.30);
  --shadow:0 1px 2px rgba(11,14,26,.05), 0 6px 20px rgba(11,14,26,.07);
  --focus:#0B7A8A;
  --led-bg:#070A14; --led-ink:#C6F53C; --led-sub:#3EE7F2;
  --wm1:#5E9A0E; --wm2:#0B7A8A; --wm3:#C3134B;
  --radius:16px; --tap:48px;
  --disp:"Arial Black","Helvetica Neue",Arial,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E1A; --surface:#141A2E; --raised:#1B2340; --sunk:#0F1426;
    --line:#28325A; --line-strong:#3B4778;
    --ink:#EEF2FF; --muted:#9AA2C6;
    --volt:#C6F53C; --volt-ink:#0B0E1A; --volt-text:#C6F53C;
    --cyan:#3EE7F2; --magenta:#FF4D8A; --amber:#FFB02E;
    --pos:#4ADE80; --neg:#FF6B6B; --warn:#FFB02E;
    --pos-bg:rgba(74,222,128,.13); --neg-bg:rgba(255,107,107,.13); --warn-bg:rgba(255,176,46,.13); --info-bg:rgba(62,231,242,.10);
    --dim-w:#7AA7FF; --dim-u:#4ADE80; --dim-g:#FF9F5A;
    --halo:rgba(0,0,0,.55);
    --shadow:none;
    --focus:#3EE7F2;
    --wm1:#C6F53C; --wm2:#3EE7F2; --wm3:#FF4D8A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E1A; --surface:#141A2E; --raised:#1B2340; --sunk:#0F1426;
  --line:#28325A; --line-strong:#3B4778;
  --ink:#EEF2FF; --muted:#9AA2C6;
  --volt:#C6F53C; --volt-ink:#0B0E1A; --volt-text:#C6F53C;
  --cyan:#3EE7F2; --magenta:#FF4D8A; --amber:#FFB02E;
  --pos:#4ADE80; --neg:#FF6B6B; --warn:#FFB02E;
  --pos-bg:rgba(74,222,128,.13); --neg-bg:rgba(255,107,107,.13); --warn-bg:rgba(255,176,46,.13); --info-bg:rgba(62,231,242,.10);
  --dim-w:#7AA7FF; --dim-u:#4ADE80; --dim-g:#FF9F5A;
  --halo:rgba(0,0,0,.55);
  --shadow:none;
  --focus:#3EE7F2;
  --wm1:#C6F53C; --wm2:#3EE7F2; --wm3:#FF4D8A;
  color-scheme:dark;
}

/* =====================================================================
   GRUNDLAGEN
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5;
  -webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--disp); font-weight:900; line-height:1.12; margin:0; text-wrap:balance; letter-spacing:.01em}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem); text-transform:uppercase}
h2{font-size:1.28rem; text-transform:uppercase}
h3{font-size:1rem; font-family:var(--body); font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-size:.8rem}
p{margin:0}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit; color:inherit}
[hidden]{display:none!important}
.huelle{max-width:1120px; margin:0 auto; padding-inline:16px; padding-block:16px 72px}
.schmal{max-width:620px}
.stapel{display:flex; flex-direction:column; gap:14px}
.zeile{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.zwischen{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
.raster{display:grid; gap:14px}
.r2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.r3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.r4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.rd{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.gedaempft{color:var(--muted)}
.klein{font-size:.86rem}
.mini{font-size:.76rem}
.zahl{font-family:var(--mono); font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.mitte{text-align:center}
hr{border:none; border-top:1px solid var(--line); margin:4px 0}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* =====================================================================
   KNÖPFE – schräg wie ein Dosen-Aufdruck
   ===================================================================== */
.knopf{display:inline-flex; align-items:center; justify-content:center; gap:.45em; min-height:var(--tap);
  padding:.65rem 1.25rem; border:none; border-radius:6px; cursor:pointer; font-weight:800; font-size:.95rem;
  text-transform:uppercase; letter-spacing:.04em; background:var(--volt); color:var(--volt-ink);
  transform:skew(-6deg); transition:filter .15s, transform .12s; text-decoration:none; white-space:nowrap}
.knopf>span{display:inline-block; transform:skew(6deg)}
.knopf:active{transform:skew(-6deg) scale(.97)}
.knopf.zweit{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--line-strong)}
.knopf.cyan{background:var(--cyan); color:var(--surface)}
.knopf.gefahr{background:var(--neg); color:#fff}
.knopf.klein{min-height:40px; padding:.4rem .85rem; font-size:.8rem}
.knopf.breit{width:100%}
.knopf:disabled{opacity:.45; cursor:not-allowed; filter:grayscale(.3)}
@media (hover:hover){ .knopf:hover:not(:disabled){filter:brightness(1.08)} }
.textknopf{background:none; border:none; padding:.4rem .2rem; color:var(--cyan); cursor:pointer; font-weight:700; min-height:40px; text-decoration:underline; text-underline-offset:3px}

/* =====================================================================
   OBERE LEISTE, TICKER, TABS
   ===================================================================== */
.leiste{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
@supports not (background:color-mix(in srgb, red 50%, blue)){ .leiste{background:var(--bg)} }
.leiste .innen{max-width:1120px; margin:0 auto; padding-inline:16px; padding-block:8px; display:flex; align-items:center; gap:10px; justify-content:space-between}
.marke{display:flex; align-items:center; gap:10px; min-width:0}
.marke .wort{font-family:var(--disp); font-weight:900; font-size:1.05rem; text-transform:uppercase; letter-spacing:.04em; font-style:italic}
.marke .wort em{font-style:inherit; color:var(--volt-text)}
.marke .kontext{font-size:.86rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.leiste .rechts{display:flex; align-items:center; gap:6px; flex-shrink:0}
.iknopf{min-width:44px; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:1.05rem; display:inline-flex; align-items:center; justify-content:center; padding:0 .6rem; gap:.35rem}
.iknopf .t{font-size:.82rem; font-weight:700}
@media (max-width:560px){ .iknopf .t{display:none} .marke .wort{display:none} .marke .kontext{max-width:none; font-weight:700; color:var(--ink)} .leiste .rechts .chip{font-size:.68rem; padding:.2rem .45rem} }

.ticker{position:relative; overflow:hidden; background:var(--led-bg); border:1px solid var(--line); color:var(--led-sub); font-family:var(--mono); font-size:.86rem; white-space:nowrap;
  padding-block:.5rem; border-radius:10px; margin-bottom:14px}
.ticker::before{content:"⚡ NEWS"; position:absolute; left:0; top:0; bottom:0; z-index:2; display:flex; align-items:center;
  background:var(--volt); color:#070A14; font-weight:900; padding:0 .75rem; font-family:var(--disp); font-size:.72rem; letter-spacing:.06em}
.ticker .band{display:inline-block; padding-left:100%; animation:band 38s linear infinite}
.ticker .band span{margin-right:3.2rem}
.ticker .band b{color:var(--led-ink)}
@keyframes band{from{transform:translateX(0)} to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){ .ticker .band{animation:none; padding-left:6.2rem; white-space:normal} .ticker .band span{display:block; margin:0 0 .2rem} }

.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; scrollbar-width:thin}
.tab{flex:0 0 auto; min-height:44px; background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:999px;
  padding:.45rem 1rem; cursor:pointer; font-weight:700; font-size:.92rem; position:relative}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.tab .punkt{position:absolute; top:6px; right:8px; width:9px; height:9px; border-radius:50%; background:var(--magenta)}

/* =====================================================================
   KARTEN, KENNZAHLEN, HINWEISE
   ===================================================================== */
.karte{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); min-width:0}
.karte.hervor{border-color:var(--volt); border-color:color-mix(in srgb, var(--volt) 70%, var(--line)); box-shadow:0 0 0 1px color-mix(in srgb, var(--volt) 55%, transparent), var(--shadow)}
.karte>h2+*,.karte>h3+*{margin-top:10px}
.kopf{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.kpi{background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-width:0}
.kpi .lbl{font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:700}
.kpi .wert{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:1.35rem; font-weight:800; margin-top:2px; overflow-wrap:anywhere}
.kpi .sub{font-size:.78rem; color:var(--muted)}
.hinweis{background:var(--info-bg); border-radius:12px; padding:10px 14px; font-size:.95rem}
.hinweis.gut{background:var(--pos-bg)} .hinweis.schlecht{background:var(--neg-bg)} .hinweis.achtung{background:var(--warn-bg)}
.notizen{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none}
.notizen li{display:flex; gap:10px; align-items:flex-start; background:var(--raised); border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:.95rem}
.notizen li .ic{flex:0 0 auto; font-size:1.15rem; line-height:1.3}
.notizen li.gut{border-left:4px solid var(--pos)} .notizen li.schlecht{border-left:4px solid var(--neg)} .notizen li.info{border-left:4px solid var(--cyan)}
.chip{display:inline-flex; align-items:center; gap:.35em; font-size:.76rem; font-weight:800; padding:.2rem .65rem; border-radius:999px;
  background:var(--raised); border:1px solid var(--line); text-transform:uppercase; letter-spacing:.05em; white-space:nowrap}
.chip.offen{background:var(--pos-bg); border-color:var(--pos); color:var(--pos)}
.chip.zu{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.chip.neu{background:var(--magenta); border-color:var(--magenta); color:#fff}
.chip.ki{background:var(--sunk)}
.farbe{width:22px; height:22px; border-radius:6px; display:inline-block; vertical-align:middle; border:2px solid var(--halo); flex:0 0 auto}
.firma{display:inline-flex; align-items:center; gap:8px; font-weight:700; min-width:0}
.firma .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* Phasen-Leiste: Einstieg – Level 1–5 – Transfer */
.phasen{display:flex; gap:4px; overflow-x:auto; padding-bottom:4px}
.phase{flex:1 0 auto; min-width:74px; text-align:center; padding:8px 6px; border-radius:10px; background:var(--raised); border:1px solid var(--line); font-size:.75rem; color:var(--muted); font-weight:700; line-height:1.2}
.phase b{display:block; font-size:1.05rem}
.phase.fertig{color:var(--pos); border-color:var(--pos); border-color:color-mix(in srgb, var(--pos) 45%, var(--line))}
.phase.jetzt{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* Balken für die drei Nachhaltigkeitsbereiche */
.dims{display:flex; flex-direction:column; gap:10px}
.dim .t{display:flex; justify-content:space-between; font-size:.85rem; font-weight:700}
.balken{height:12px; background:var(--sunk); border-radius:999px; overflow:hidden; margin-top:4px; position:relative}
.balken>i{display:block; height:100%; border-radius:999px}
.balken.w>i{background:var(--dim-w)} .balken.u>i{background:var(--dim-u)} .balken.g>i{background:var(--dim-g)}
.balken.neutral>i{background:var(--cyan)}
.balken .mark{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); opacity:.55}

/* =====================================================================
   FORMULARE
   ===================================================================== */
.feld{display:flex; flex-direction:column; gap:6px}
.feld>.t{font-size:.8rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:800}
.feld .hilfe{font-size:.82rem; color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{width:100%; min-height:var(--tap); background:var(--surface);
  border:1.5px solid var(--line-strong); border-radius:10px; padding:.55rem .75rem; font-size:1.05rem}
textarea{min-height:110px; resize:vertical; line-height:1.45}
input.zahl{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--focus); outline:3px solid color-mix(in srgb, var(--focus) 45%, transparent); border-color:var(--focus)}
input[type=range]{width:100%; accent-color:var(--magenta); min-height:36px}
.stepper{display:flex; align-items:stretch; gap:6px}
.stepper input{text-align:center}
.stepper button{min-width:var(--tap); border-radius:10px; border:1.5px solid var(--line-strong); background:var(--raised); font-weight:900; font-size:1.1rem; cursor:pointer}
.stepper button.lang{min-width:auto; padding:0 .6rem; font-size:.8rem}
.wahl{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.option{display:flex; flex-direction:column; gap:2px; text-align:left; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line-strong); background:var(--surface); cursor:pointer; min-height:var(--tap)}
.option b{font-size:.98rem}
.option .klein{color:var(--muted)}
.option[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink); background:var(--raised)}
.option:disabled{opacity:.55; cursor:not-allowed}
.logos{display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:6px}
.logos button{min-height:52px; font-size:1.6rem; border-radius:12px; border:1.5px solid var(--line-strong); background:var(--surface); cursor:pointer}
.logos button[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink); background:var(--raised)}
.farben{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:6px}
.farben button{display:flex; align-items:center; gap:8px; min-height:44px; border-radius:10px; border:1.5px solid var(--line-strong); background:var(--surface); cursor:pointer; padding:0 .6rem; font-size:.86rem; font-weight:700}
.farben button[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink)}
.farben button:disabled{opacity:.4; cursor:not-allowed; text-decoration:line-through}
.bereich{border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:14px; background:var(--raised)}
.bereich>.zwischen h3{margin:0}
.ereignisse{display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.ereignis{text-align:left; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--surface); cursor:pointer; display:flex; gap:10px; align-items:flex-start; min-height:var(--tap)}
.ereignis .ic{font-size:1.4rem; line-height:1.1}
.ereignis[aria-pressed="true"]{border-color:var(--magenta); box-shadow:inset 0 0 0 2px var(--magenta)}
.ereignis:disabled{opacity:.45; cursor:not-allowed}

/* =====================================================================
   TABELLEN
   ===================================================================== */
.tabwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:10px}
table{width:100%; border-collapse:collapse; font-size:.9rem}
th{font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); text-align:left; padding:8px; border-bottom:1.5px solid var(--line-strong); white-space:nowrap}
td{padding:8px; border-bottom:1px solid var(--line); vertical-align:middle}
td.z,th.z{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
tr.ich td{background:var(--raised); background:color-mix(in srgb, var(--volt) 16%, transparent)}
tr.summe td{font-weight:800; border-top:2px solid var(--line-strong)}
th button{background:none; border:none; font:inherit; color:inherit; text-transform:inherit; letter-spacing:inherit; cursor:pointer; padding:0}

/* =====================================================================
   START, DIALOG, TOAST, DIAGRAMME, QUIZ, PODEST
   ===================================================================== */
.held{display:grid; gap:18px; align-items:center; grid-template-columns:auto 1fr; padding-block:18px 8px}
.held .wortmarke{font-family:var(--disp); font-weight:900; font-style:italic; font-size:clamp(2.6rem,11vw,5.4rem); line-height:.9; letter-spacing:.01em;
  background:linear-gradient(95deg,var(--wm1) 0%,var(--wm2) 55%,var(--wm3) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-transform:uppercase}
.held .dose{width:88px; height:auto}
@media (max-width:520px){ .held{grid-template-columns:1fr; text-align:left} .held .dose{width:64px} }
.rollen{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.rolle{display:flex; flex-direction:column; gap:6px; text-align:left; padding:20px; border-radius:var(--radius); border:1.5px solid var(--line); background:var(--surface); cursor:pointer; box-shadow:var(--shadow); min-height:130px}
.rolle .ic{font-size:2rem}
.rolle b{font-family:var(--disp); font-size:1.2rem; text-transform:uppercase}
@media (hover:hover){ .rolle:hover{border-color:var(--ink)} }
.code{font-family:var(--mono); font-weight:900; font-size:clamp(1.8rem,7vw,2.6rem); letter-spacing:.18em; color:var(--ink); background:var(--raised); border:2px dashed var(--line-strong); border-radius:12px; padding:.2rem .8rem; display:inline-block}

.dialog-hg{position:fixed; inset:0; background:rgba(7,10,20,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:60}
.dialog{background:var(--surface); color:var(--ink); border-radius:var(--radius); padding:20px; max-width:460px; width:100%; display:flex; flex-direction:column; gap:14px; border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,.35); max-height:88vh; overflow:auto}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); font-weight:700;
  padding:.75rem 1.2rem; border-radius:14px; z-index:70; box-shadow:0 10px 30px rgba(0,0,0,.35); max-width:min(92vw,560px); text-align:center}
.status-netz{position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:65; background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn); border-radius:999px; padding:.35rem .8rem; font-size:.8rem; font-weight:800}

.diagramm{width:100%; height:auto; display:block}
.diagramm text{fill:var(--muted); font-family:var(--body); font-size:11px}
.diagramm .gitter{stroke:var(--line); stroke-width:1}
.diagramm .null{stroke:var(--line-strong); stroke-width:1.5}
.legende{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.82rem; margin-top:6px}
.legende span{display:inline-flex; align-items:center; gap:6px}
.dreieck{width:100%; max-width:320px; height:auto; display:block; margin:0 auto}
.dreieck text{font-family:var(--body); font-size:13px; font-weight:800}

.quiz .antworten{display:grid; gap:8px; margin-top:10px}
.quiz .antwort{text-align:left; min-height:var(--tap); padding:10px 14px; border-radius:12px; border:1.5px solid var(--line-strong); background:var(--surface); cursor:pointer}
.quiz .antwort.richtig{background:var(--pos-bg); border-color:var(--pos); color:var(--pos); font-weight:700}
.quiz .antwort.falsch{background:var(--neg-bg); border-color:var(--neg); color:var(--neg)}
.quiz .antwort:disabled{cursor:default}
.fortschritt{height:8px; background:var(--sunk); border-radius:99px; overflow:hidden}
.fortschritt>i{display:block; height:100%; background:var(--cyan)}

.podest{display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:10px; align-items:end}
.podest .platz{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; min-width:0}
.podest .sockel{width:100%; border-radius:12px 12px 4px 4px; display:flex; align-items:flex-start; justify-content:center; padding-top:8px; font-family:var(--disp); font-weight:900; font-size:1.6rem; color:var(--volt-ink)}
.podest .p1 .sockel{height:120px; background:var(--volt)} .podest .p2 .sockel{height:86px; background:#C7D0E4} .podest .p3 .sockel{height:64px; background:#F2B27A}
.podest .logo{font-size:2rem}
.podest .nm{font-weight:800; overflow-wrap:anywhere}
.erfolge{display:flex; flex-wrap:wrap; gap:8px}
.erfolg{display:inline-flex; align-items:center; gap:8px; background:var(--raised); border:1px solid var(--amber); border-radius:999px; padding:.3rem .85rem; font-size:.86rem}
.erfolg.fehlt{border-style:dashed; border-color:var(--line-strong); opacity:.6}
.banner{background:var(--ink); color:var(--bg); border-radius:12px; padding:10px 14px; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:12px; font-size:.92rem}
.banner .knopf.zweit{color:var(--bg); box-shadow:inset 0 0 0 2px var(--muted); box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--bg) 50%, transparent)}
details.aufklapp{border:1px solid var(--line); border-radius:12px; background:var(--raised)}
details.aufklapp>summary{cursor:pointer; padding:12px 14px; font-weight:800; list-style:none; min-height:var(--tap); display:flex; align-items:center; justify-content:space-between; gap:8px}
details.aufklapp>summary::-webkit-details-marker{display:none}
details.aufklapp>summary::after{content:"＋"; font-weight:900}
details.aufklapp[open]>summary::after{content:"－"}
details.aufklapp>.inhalt{padding:0 14px 14px}
dl.lexikon{display:grid; grid-template-columns:minmax(120px,max-content) 1fr; gap:8px 16px; margin:0}
dl.lexikon dt{font-weight:800}
dl.lexikon dd{margin:0}
@media (max-width:560px){ dl.lexikon{grid-template-columns:1fr} dl.lexikon dd{margin-bottom:6px} }
.planung{display:grid; grid-template-columns:1fr auto; gap:4px 12px; font-size:.93rem}
.planung .z{font-family:var(--mono); text-align:right; font-variant-numeric:tabular-nums}
.planung .sum{font-weight:800; border-top:1.5px solid var(--line-strong); padding-top:4px}

/* =====================================================================
   DRUCK
   ===================================================================== */
#druck{display:none}
.nur-druck{display:none}
@media print{
  body{background:#fff; color:#000; font-size:11pt}
  .leiste,.tabs,.ticker,.knopf,.iknopf,.textknopf,.nicht-drucken,.toast,.status-netz,.dialog-hg,.banner{display:none!important}
  .karte,.kpi,.bereich,.notizen li{box-shadow:none; border-color:#999; break-inside:avoid; background:#fff}
  .huelle{max-width:none; padding:0}
  body.druck-modus #app{display:none}
  body.druck-modus #druck{display:block}
  .druckblatt{page-break-after:always}
  .druckblatt:last-child{page-break-after:auto}
  .linie{border-bottom:1px solid #000; min-height:28px}
  .nur-druck{display:block; margin-bottom:8px}
  .druckblatt td{height:13mm}
  a{color:#000}
}

const Lokal = (() => {
  let ls = null;
  const ersatz = {};
  try {
    const t = "__voltage_test__";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    ls = window.localStorage;
  } catch (e) { ls = null; }
  return {
    get dauerhaft() { return !!ls; },
    lies(k, std) {
      try {
        const roh = ls ? ls.getItem(k) : (k in ersatz ? ersatz[k] : null);
        return roh == null ? std : JSON.parse(roh);
      } catch (e) { return std; }
    },
    schreib(k, v) {
      const roh = JSON.stringify(v);
      try { if (ls) ls.setItem(k, roh); else ersatz[k] = roh; return true; }
      catch (e) { return false; }   // Speicher voll
    },
    loesche(k) {
      try { if (ls) ls.removeItem(k); } catch (e) { /* egal */ }

    },
    schluessel(praefix) {

        if (ls) { for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k && k.startsWith(praefix)) out.push(k); } }
        else out.push(...Object.keys(ersatz).filter((k) => k.startsWith(praefix)));

})();

/* Firebase speichert keine leeren Objekte, keine leeren Listen und keine
   null-Werte. Der lokale Speicher verhält sich gleich, damit das Spiel in
   beiden Modi identisch läuft. */
function bereinige(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  if (typeof v !== "object") return v;
  if (Array.isArray(v)) {
    const a = v.map(bereinige).filter((x) => x !== null);
    return a.length ? a : null;
  }
  const o = {};
  for (const [k, w] of Object.entries(v)) { const c = bereinige(w); if (c !== null) o[k] = c; }
  return Object.keys(o).length ? o : null;
}

/* Lokale «Datenbank»: pro Spiel ein Eintrag im localStorage, Pfade wie bei Firebase */
const LokalDB = {
  art: "lokal",
  teile(pfad) {
    const t = String(pfad).split("/").filter(Boolean);
    return { key: "voltage:db:" + t.slice(0, 2).join("/"), rest: t.slice(2) };
  },
  async lies(pfad) {
    const { key, rest } = this.teile(pfad);
    let v = Lokal.lies(key, null);
    for (const s of rest) { if (v == null || typeof v !== "object") { v = null; break; } v = v[s]; }
    return { ok: true, daten: v === undefined ? null : kopie(v) };
  },
  async schreib(pfad, wert) {
    const { key, rest } = this.teile(pfad);
    const neu = bereinige(kopie(wert));
    if (!rest.length) {
      if (neu == null) { Lokal.loesche(key); return { ok: true }; }
      return Lokal.schreib(key, neu) ? { ok: true } : { ok: false, status: "voll" };
    }
    let wurzel = Lokal.lies(key, null);
    if (wurzel == null || typeof wurzel !== "object") wurzel = {};
    let knoten = wurzel;
    for (let i = 0; i < rest.length - 1; i++) {
      if (knoten[rest[i]] == null || typeof knoten[rest[i]] !== "object") knoten[rest[i]] = {};
      knoten = knoten[rest[i]];
    }
    const letzter = rest[rest.length - 1];
    if (neu == null) delete knoten[letzter]; else knoten[letzter] = neu;
    const alles = bereinige(wurzel);
    if (alles == null) { Lokal.loesche(key); return { ok: true }; }
    return Lokal.schreib(key, alles) ? { ok: true } : { ok: false, status: "voll" };
  },
  async ergaenze(pfad, obj) {
    for (const [k, v] of Object.entries(obj || {})) {
      const r = await this.schreib(pfad + "/" + k, v);
      if (!r.ok) return r;
    }
    return { ok: true };
  },
  async loesche(pfad) { return this.schreib(pfad, null); }
};

/* =========================================================================
   3. ONLINE-SYNC – Firebase Realtime Database über REST (ohne SDK)
   Wichtig: Ohne Anmeldung sind für die Datenbank alle Geräte gleich.
   Geschützt wird über die Regeln in firebase/regeln.json, nicht über diesen
   Code. Der PIN schützt nur die Oberfläche.
   ========================================================================= */
const FirebaseDB = {
  art: "online",
  basis: "",
  fehler: null,
  url(pfad) {
    return `${this.basis.replace(/\/+$/, "")}/${KONFIG.projekt}/${String(pfad).replace(/^\/+/, "")}.json`;
  },
  async anfrage(pfad, methode, koerper) {
    if (!this.basis) return { ok: false, status: 0 };
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const uhr = ctrl ? setTimeout(() => ctrl.abort(), 12000) : null;
    try {
      const antwort = await fetch(this.url(pfad), {
        method: methode, cache: "no-store",
        headers: koerper !== undefined ? { "Content-Type": "application/json" } : undefined,
        body: koerper !== undefined ? JSON.stringify(koerper) : undefined,
        signal: ctrl ? ctrl.signal : undefined
      });
      if (uhr) clearTimeout(uhr);
      if (!antwort.ok) { this.fehler = "HTTP " + antwort.status; return { ok: false, status: antwort.status }; }
      this.fehler = null;
      const text = await antwort.text();
      return { ok: true, daten: text ? JSON.parse(text) : null };
    } catch (e) {
      if (uhr) clearTimeout(uhr);
      this.fehler = "kein Netz";
      return { ok: false, status: 0 };
    }
  },
  lies(pfad) { return this.anfrage(pfad, "GET"); },
  schreib(pfad, wert) { return this.anfrage(pfad, "PUT", bereinige(kopie(wert))); },
  ergaenze(pfad, obj) { return this.anfrage(pfad, "PATCH", bereinige(kopie(obj)) || {}); },
  loesche(pfad) { return this.anfrage(pfad, "DELETE"); }
};

// Einfacher Hash für PINs (schützt die Oberfläche, nicht die Daten)
function hashText(s) {
  let h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x5bd1e995;
  for (const ch of String(s)) {
    const c = ch.codePointAt(0);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 ^ (c + 0x9e37), 0x5bd1e995) >>> 0;
    h2 ^= h2 >>> 15;
  }
  return (h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0");
}

      <button class="knopf zweit" data-w="0"><span>${esc(nein)}</span></button></div></div>`;
    const zu = (w) => { hg.remove(); document.removeEventListener("keydown", taste); aufloesen(w); };
    const taste = (e) => { if (e.key === "Escape") zu(false); };
    hg.addEventListener("click", (e) => {
      const b = e.target.closest("[data-w]");
      if (b) zu(b.dataset.w === "1"); else if (e.target === hg) zu(false);
    });
    document.addEventListener("keydown", taste);
    document.body.append(hg);
    const erster = hg.querySelector("[data-w='0']");
    if (erster) erster.focus();
  });
}

/* =========================================================================

   Nachfrage: Logit-Modell mit «Aussenoption». Jede Firma hat eine
   Attraktivität (Preis, Bekanntheit, Qualität, Image, Labels). Ist eine

/*<ENGINE>*/
const Engine = (() => {
  const R = () => DATEN.regeln;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const zahl = (v, std) => { const n = Number(v); return Number.isFinite(n) ? n : std; };
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;
  const dup = (o) => JSON.parse(JSON.stringify(o));

  function startZustand(einst) {
    const r = R(), s = r.start;
    return {
      kasse: zahl(einst && einst.startkapital, r.startkapital),
      kredit: 0, lager: 0,
      mitarbeitende: s.mitarbeitende, zufriedenheit: s.zufriedenheit, qualitaet: s.qualitaet,
      image: s.image, bekanntheit: s.bekanntheit, umwelt: s.umwelt, gesellschaft: s.gesellschaft,
      anlage: 0, solar: 0, anlageKauf: 0, solarKauf: 0,
      gewinnTotal: 0, verlustSerie: 0, runden: 0,
      letzter: null
    };
  }

  // Zustand aus der Datenbank vervollständigen (fehlende Felder = Startwerte)
  function zustandVon(z, einst) {
    const s = startZustand(einst);
    if (!z || typeof z !== "object") return s;
    for (const k of Object.keys(s)) {
      if (k === "letzter") s.letzter = z.letzter && typeof z.letzter === "object" ? dup(z.letzter) : null;
      else s[k] = zahl(z[k], s[k]);
    }
    return s;
  }

  function saisonVon(runde, einst) {
    const r = R();
    if (einst && einst.saison === false) return { name: "", ic: "", faktor: 1 };
    return r.saisons[(Math.max(1, zahl(runde, 1)) - 1) % r.saisons.length];
  }

  function effekte(schluessel) {
    const fx = { nachfrage: 1, preisEmpf: R().preisEmpfindlichkeit, qualGewicht: 1, imageGewicht: 1,
      socialBoost: 1, sponsoringBoost: 1, labelBoost: 1, kostenFaktor: 1, zuckersteuer: 0, strom: 0,
      kapazitaet: 1, influencer: false, jugendschutz: false, lohnDruck: false };
    for (const k of schluessel || []) {
      const e = DATEN.ereignisse[k];
      if (!e) continue;
      for (const [p, v] of Object.entries(e.fx)) {
        if (p === "nachfrage" || p === "kostenFaktor" || p === "kapazitaet") fx[p] *= v;
        else if (p === "zuckersteuer" || p === "strom") fx[p] += v;
        else if (typeof v === "boolean") fx[p] = fx[p] || v;
        else if (p === "preisEmpf") fx[p] = v;
        else fx[p] = Math.max(fx[p], v);
      }
    }
    return fx;
  }

  // Richtwert: Nachfrage einer durchschnittlichen Firma bei marktüblichem Auftritt
  function prognose(runde, schluessel, einst) {
    const s = saisonVon(runde, einst), fx = effekte(schluessel);
    const faktor = s.faktor * fx.nachfrage;
    return { saison: s, faktor, richtwert: Math.round(R().basisNachfrage * faktor / 500) * 500 };
  }

  // Entscheid auf gültige Werte bringen; noch gesperrte Bereiche erhalten Standardwerte
  function normalisiere(roh, level, z) {
    const r = R(), d = roh || {};
    const out = {
      menge: clamp(Math.round(zahl(d.menge, r.basisNachfrage)), 0, 500000),
      preis: r2(clamp(zahl(d.preis, r.referenzpreis), r.preisMin, r.preisMax)),
      social: 0, plakat: r.grundwerbung, sponsoring: 0,
      personal: 0, lohn: "mittel", weiterbildung: 0,
      zutaten: "standard", dose: "standard", rezeptur: "normal",
      investAnlage: false, investSolar: false, kreditNeu: 0, kreditRueck: 0, lernende: 0, engagement: 0
    };
    if (level >= 2) {
      const m = r.werbung.max;
      out.social = clamp(Math.round(zahl(d.social, 0)), 0, m);
      out.plakat = clamp(Math.round(zahl(d.plakat, 0)), 0, m);
      out.sponsoring = clamp(Math.round(zahl(d.sponsoring, 0)), 0, m);
    }
    if (level >= 3) {

  const rs = resultate || App.resultate;
  const nummern = Object.keys(rs).map(Number).filter((r) => vorRunde == null || r < vorRunde).sort((a, b) => b - a);
  for (const r of nummern) { const x = rs[r].firmen[fid]; if (x) return { runde: r, res: x, gesamt: rs[r] }; }
  return null;
}
function punkteAktuell(fid) {
  const l = letztesResultat(fid);
  return l && l.res.punkte ? l.res.punkte : Engine.punkteVon(Engine.startZustand(einst()), einst());
}
function vorgeschlagenesLevel(runde) {
  return klemme(Math.ceil(runde / einst().rundenProLevel), 1, 5);
}

// Rangliste: nach Gesamtpunkten (Nachhaltigkeit) oder nach Wirtschaft
function rangliste() {
  const wertung = einst().wertung;
  return firmenListe().map((f) => {
    const l = letztesResultat(f.id);
    const z = l ? Engine.zustandVon(l.res.zustand, einst()) : Engine.startZustand(einst());
    const p = l && l.res.punkte ? l.res.punkte : Engine.punkteVon(z, einst());
    return { f, z, p, wert: wertung === "gewinn" ? p.wirtschaft : p.gesamt, gewinnTotal: z.gewinnTotal };
  }).sort((a, b) => (b.wert - a.wert) || (b.gewinnTotal - a.gewinnTotal) || a.f.name.localeCompare(b.f.name));
}

// Erfolge einer Firma aus dem Verlauf berechnen
function erfolgeVon(fid) {
  const hat = new Set();
  for (const r of rundenListe()) {
    const R = App.resultate[r], x = R.firmen[fid];
    if (!x) continue;
    const z = x.zustand || {};
    if (x.gewinn > 0) hat.add("erstergewinn");
    if (x.gewinn > 30000) hat.add("rakete");
    if (x.gewinn > 0 && num(x.zustand && x.zustand.verlustSerie) === 0 && hatVerlustSerieVor(fid, r)) hat.add("comeback");
    const max = Math.max(...Object.values(R.firmen).map((y) => num(y.marktanteil)));
    if (x.marktanteil > 0 && x.marktanteil === max) hat.add("marktfuehrer");
    if (x.verfuegbar > 0 && (x.verfuegbar - x.verkauft) <= x.verfuegbar * 0.03 && x.fehlmenge <= x.nachfrage * 0.03) hat.add("punktlandung");
    if (num(z.bekanntheit) >= 80) hat.add("bekannt");
    if (num(z.zufriedenheit) >= 80) hat.add("arbeitgeber");
    if (num(z.umwelt) >= 70) hat.add("oeko");
    if (num(z.image) >= 75) hat.add("kult");
    const p = x.punkte || {};
    if (p.wirtschaft >= 60 && p.umwelt >= 60 && p.gesellschaft >= 60) hat.add("balance");
  }
  return DATEN.erfolge.map((e) => ({ ...e, erreicht: hat.has(e.id) }));
}
function hatVerlustSerieVor(fid, runde) {
  const vorher = rundenListe().filter((r) => r < runde).slice(-2);
  return vorher.length === 2 && vorher.every((r) => { const x = App.resultate[r].firmen[fid]; return x && x.gewinn < 0; });
}

function sitzungSpeichern() {

  if (s.rolle === "gruppe") { Lokal.schreib("voltage:sitzung", { rolle: "gruppe", code: s.code, fid: s.fid, modus: s.modus }); Sitzungsspeicher.loesche("voltage:sitzungL"); }
  else if (s.rolle === "lehrer") { Sitzungsspeicher.schreib("voltage:sitzungL", { rolle: "lehrer", code: s.code, modus: s.modus, alsFirma: s.alsFirma || null }); }
}
function sitzungBeenden() {
  Abgleich.stop();
  if (App.sitzung.rolle === "gruppe") Lokal.loesche("voltage:sitzung");
  if (App.sitzung.rolle === "lehrer") Sitzungsspeicher.loesche("voltage:sitzungL");
  App.sitzung = { rolle: null, code: null, fid: null, modus: "lokal", alsFirma: null };
  App.spiel = null; App.firmen = {}; App.resultate = {}; App.entscheide = {}; App.eigenerEntscheid = undefined; App.reflexion = {};
  App.version = null; App.signatur = ""; App.berichtRunde = null; App.ergebnisRunde = null; App.quiz = null;
  App.entwurf.runde = null;
}
function meineSpiele() { return liste(Lokal.lies("voltage:meineSpiele", [])).filter((x) => x && x.code); }
function meineSpieleMerken(eintrag) {
  const l = meineSpiele().filter((x) => x.code !== eintrag.code);
  l.unshift(eintrag);
  Lokal.schreib("voltage:meineSpiele", l.slice(0, 20));
}
function meineSpieleEntfernen(code) { Lokal.schreib("voltage:meineSpiele", meineSpiele().filter((x) => x.code !== code)); }

const Abgleich = {
  uhr: null, laeuft: false,
  start() {
    this.stop();
    const ms = App.sitzung.modus === "online" ? KONFIG.taktMs : KONFIG.taktLokalMs;
    this.uhr = setInterval(() => this.tick(false), ms);
    return this.tick(true);
  },
  stop() { if (this.uhr) clearInterval(this.uhr); this.uhr = null; },
  async tick(erzwingen) {
    if (!App.sitzung.code || (document.hidden && !erzwingen)) return;
    if (this.laeuft) { if (erzwingen) this.nochmal = true; return; }
    this.laeuft = true;
    try { await ladeDaten(erzwingen); } catch (e) { console.error(e); }
    finally { this.laeuft = false; }
    if (this.nochmal) { this.nochmal = false; await this.tick(true); }
  }
};
document.addEventListener("visibilitychange", () => { if (!document.hidden && App.sitzung.code) Abgleich.tick(true); });
window.addEventListener("storage", (e) => {
  if (App.sitzung.code && App.sitzung.modus === "lokal" && e.key && e.key.startsWith("voltage:db:")) Abgleich.tick(true);
});

function setzeOffline(an) {
  if (App.offline === an) return;
  App.offline = an;
  let el = $("#netz");
  if (an && !el) { el = document.createElement("div"); el.id = "netz"; el.className = "status-netz"; el.textContent = "⚠️ Keine Verbindung – versuche erneut …"; document.body.append(el); }
  if (!an && el) el.remove();
}

async function ladeDaten(erzwingen) {
  const code = App.sitzung.code, S = store(), basis = `spiele/${code}`;
  App.zaehler++;
  const r = await S.lies(`${basis}/spiel`);
  if (!r.ok) { setzeOffline(true); return; }
  setzeOffline(false);
  if (r.daten == null) { spielVerschwunden(); return; }
  const alt = App.spiel;
  const spiel = spielNormal(r.daten);
  if (!spiel.code) spiel.code = code;
  const neu = erzwingen || !alt || spiel.version !== App.version;
  const rolle = App.sitzung.rolle, fid = aktiveFirmaId();
  if (neu || rolle === "lehrer" || App.zaehler % 4 === 0) {
    const f = await S.lies(`${basis}/firmen`);
    if (f.ok) App.firmen = firmenNormal(f.daten);
  }
  if (neu) {
    const rs = await S.lies(`${basis}/resultate`);
    if (rs.ok) App.resultate = resultateNormal(rs.daten);
  }
  const rundeOffen = spiel.status === "offen" || spiel.status === "auswertung";
  if (rolle === "lehrer") {
    if (rundeOffen) { const e = await S.lies(`${basis}/entscheide/r${spiel.runde}`); if (e.ok) App.entscheide = e.daten && typeof e.daten === "object" ? e.daten : {}; }
    else App.entscheide = {};
    if (neu || App.zaehler % 3 === 0) { const rf = await S.lies(`${basis}/reflexion`); if (rf.ok) App.reflexion = rf.daten && typeof rf.daten === "object" ? rf.daten : {}; }
  }
  if (fid) {
    if (rundeOffen && (neu || !alt || alt.runde !== spiel.runde || App.eigenerEntscheid === undefined)) {
      const e = await S.lies(`${basis}/entscheide/r${spiel.runde}/${fid}`);
      if (e.ok) App.eigenerEntscheid = e.daten || null;
    } else if (!rundeOffen) App.eigenerEntscheid = undefined;
    if (rolle === "gruppe" && neu) { const rf = await S.lies(`${basis}/reflexion`); if (rf.ok) App.reflexion = rf.daten && typeof rf.daten === "object" ? rf.daten : {}; }
  }
  if (alt && rolle === "gruppe") {
    if (spiel.status === "offen" && (alt.runde !== spiel.runde || alt.status !== "offen") && alt.status !== "auswertung") toast(`🔔 Quartal ${spiel.runde} ist offen – trefft eure Entscheidungen!`, 4500);
    else if (spiel.status === "ausgewertet" && alt.status !== "ausgewertet") { toast(`📊 Quartal ${spiel.runde} ist ausgewertet – euer Bericht ist da!`, 4500); App.berichtRunde = null; }
    else if (spiel.status === "beendet" && alt.status !== "beendet") toast("🏁 Das Spiel ist beendet – jetzt kommt die Schlussbilanz.", 4500);
  }
  await sendeAusstehende(spiel);   // nach den Hinweisen oben, damit «zu spät» sichtbar bleibt
  App.spiel = spiel;
  App.version = spiel.version;
  zeichneWennNoetig();
}

function spielVerschwunden() {
  const war = App.sitzung.rolle;
  sitzungBeenden();
  App.bildschirm = "start";
  zeichne();
  toast(war ? "ℹ️ Dieses Spiel gibt es nicht mehr – es wurde gelöscht." : "ℹ️ Spiel nicht gefunden.", 4500);
}

// Nur neu zeichnen, wenn sich etwas geändert hat – und nie mitten im Tippen
function signaturJetzt() {
  const lehrer = App.sitzung.rolle === "lehrer";
  return JSON.stringify([App.bildschirm, App.spiel, App.firmen, rundenListe().map((r) => App.resultate[r].zeit),
    lehrer ? Object.entries(App.entscheide || {}).map(([k, v]) => k + ":" + (v && v.zeit)) : 0,
    App.eigenerEntscheid ? App.eigenerEntscheid.zeit : App.eigenerEntscheid === null ? "leer" : "?",
    Object.keys(App.reflexion || {}).length, JSON.stringify(App.reflexion || {}).length, abgabeAusstehend()]);
}
function eingabeAktiv() {
  const a = document.activeElement;
  return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT") && a.type !== "range" && a.type !== "file");
}
function zeichneWennNoetig() {
  const sig = signaturJetzt();
  if (sig === App.signatur && !App.renderWartet) return;
  if (eingabeAktiv()) { App.renderWartet = true; return; }
  zeichne();
}
document.addEventListener("focusout", () => {
  if (!App.renderWartet) return;
  setTimeout(() => { if (App.renderWartet && !eingabeAktiv()) zeichne(); }, 350);
});

/* Ausstehende Abgaben (bei Netzausfall lokal zwischengespeichert) nachliefern –
   aber nur, solange ihr Quartal noch offen ist */
async function sendeAusstehende(spiel) {
  const code = App.sitzung.code;
  if (!code) return;
  for (const k of Lokal.schluessel(`voltage:ausstehend:${code}:`)) {
    const eintrag = Lokal.lies(k, null);
    if (!eintrag || !eintrag.pfad) { Lokal.loesche(k); continue; }
    if (spiel && eintrag.runde && (spiel.status !== "offen" || spiel.runde !== eintrag.runde)) {
      Lokal.loesche(k);
      if (App.eigenerEntscheid && App.eigenerEntscheid.runde === eintrag.runde) App.eigenerEntscheid = undefined;
      toast(`⏰ Eure Abgabe für Quartal ${eintrag.runde} kam zu spät – der Autopilot hat übernommen.`, 6000);
      continue;
    }
    const r = await store().schreib(eintrag.pfad, eintrag.wert);
    if (r.ok) { Lokal.loesche(k); if (eintrag.hinweis) toast(eintrag.hinweis); }
  }
}
function abgabeAusstehend() {
  const s = App.spiel, fid = aktiveFirmaId();
  return !!(s && fid && Lokal.lies(`voltage:ausstehend:${App.sitzung.code}:${fid}:r${s.runde}`, null));
}

/* =========================================================================
   9. AKTIONEN – Spiel anlegen, Runden steuern, Firmen, Export
   ========================================================================= */
async function spielSuchen(codeRoh) {
  const code = String(codeRoh || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length < 6) return { fehler: "Der Spielcode hat 6 Zeichen." };
  const modi = onlineAdresse() ? ["online", "lokal"] : ["lokal"];
  let offline = false;
  for (const m of modi) {
    const r = await store(m).lies(`spiele/${code}/spiel`);
    if (r.ok && r.daten) return { code, modus: m, spiel: spielNormal(r.daten) };
    if (!r.ok && m === "online") offline = true;
  }
  return { fehler: offline ? "Keine Verbindung zur Online-Datenbank. Prüft das WLAN und versucht es nochmals." : "Kein Spiel mit diesem Code gefunden. Stimmt der Code?" };
}

async function spielErstellen(werte) {
  const modus = werte.modus === "online" && onlineAdresse() ? "online" : "lokal";
  const S = store(modus);
  let code = null;
  for (let i = 0; i < 6 && !code; i++) {
    const kandidat = werte.code || neuerCode();
    const r = await S.lies(`spiele/${kandidat}/spiel`);
    if (!r.ok) return { fehler: "Keine Verbindung zur Datenbank." };
    if (r.daten == null) code = kandidat;
    if (werte.code && !code) return { fehler: "Diesen Spielcode gibt es schon." };
  }
  if (!code) return { fehler: "Kein freier Spielcode gefunden – bitte nochmals versuchen." };
  const jetzt = Date.now();
  const spiel = {
    name: text(werte.name, 60) || "Voltage", code, erstellt: jetzt, version: 1, status: "vorbereitung", runde: 0, level: 1,
    ereignisse: [], verlauf: {}, demo: werte.demo === true,
    einstellungen: {
      startkapital: klemme(num(werte.startkapital, DATEN.regeln.startkapital), 50000, 1000000),
      rundenProLevel: klemme(Math.round(num(werte.rundenProLevel, 2)), 1, 4),
      saison: werte.saison !== false, ki: klemme(Math.round(num(werte.ki, 0)), 0, DATEN.kiFirmen.length),
      rangliste: werte.rangliste === "alle" ? "alle" : "top3", wertung: werte.wertung === "gewinn" ? "gewinn" : "nachhaltig"
    }
  };
  let r = await S.schreib(`lehrer/${code}/${pinHash(code, werte.pin)}`, true);
  if (r.ok) r = await S.schreib(`spiele/${code}/spiel`, spiel);
  if (!r.ok) return { fehler: r.status === "voll" ? "Der Speicher dieses Geräts ist voll." : "Speichern fehlgeschlagen." };
  for (let i = 0; i < spiel.einstellungen.ki; i++) {
    const k = DATEN.kiFirmen[i];
    await S.schreib(`spiele/${code}/firmen/${k.id}`, { id: k.id, name: k.name, logo: k.logo, farbe: k.farbe, ki: true, erstellt: jetzt + i });
  }
  meineSpieleMerken({ code, name: spiel.name, modus, erstellt: jetzt, demo: spiel.demo || undefined });
  return { code, modus };
}

async function lehrerOeffnen(code, modus, alsFirma) {
  if (!App.sitzung || App.sitzung.code !== code) App.entwurf.runde = null;
  App.sitzung = { rolle: "lehrer", code, fid: null, modus, alsFirma: alsFirma || null };
  sitzungSpeichern();
  App.bildschirm = "lehrer";
  App.tabL = App.tabL || "cockpit";
  App.version = null; App.spiel = null;
  zeichne();
  await Abgleich.start();
}
async function gruppeOeffnen(code, modus, fid) {
  App.sitzung = { rolle: "gruppe", code, fid, modus, alsFirma: null };
  sitzungSpeichern();
  App.bildschirm = "gruppe";
  App.tabG = "zentrale";
  App.version = null; App.spiel = null; App.eigenerEntscheid = undefined;

async function spielSchreiben(aenderung, ohneVersion) {
  const S = store(), code = App.sitzung.code;
  const frisch = await S.lies(`spiele/${code}/spiel`);
  if (!frisch.ok || !frisch.daten) { toast("⚠️ Keine Verbindung – bitte nochmals versuchen."); return false; }
  const s = spielNormal(frisch.daten);
  const neu = spielDaten(s, aenderung);
  if (!ohneVersion) neu.version = s.version + 1;
  const r = await S.schreib(`spiele/${code}/spiel`, neu);
  if (!r.ok) { toast("⚠️ Speichern fehlgeschlagen – bitte nochmals versuchen."); return false; }
  return true;
}

async function rundeOeffnen() {
  const s = App.spiel;
  if (!s || (s.status !== "vorbereitung" && s.status !== "ausgewertet")) return;
  if (gruppenListe().length === 0 && s.einstellungen.ki === 0) { toast("Es gibt noch keine Firmen im Spiel."); return; }
  const n = s.status === "vorbereitung" ? 1 : s.runde + 1;
  const plan = App.entwurf.runde || {};
  const level = klemme(Math.round(num(plan.level, vorgeschlagenesLevel(n))), 1, 5);
  const ereignisse = liste(plan.ereignisse).filter((k) => DATEN.ereignisse[k] && DATEN.ereignisse[k].abLevel <= level).slice(0, 2);
  const ok = await spielSchreiben({ runde: n, level, ereignisse, status: "offen" });
  if (!ok) return;
  App.entwurf.runde = null;
  toast(`🔓 Quartal ${n} ist offen (Level ${level})`);
  await Abgleich.tick(true);
}

/* Auswertung: Abgaben sperren, Computer-Firmen entscheiden lassen, Markt
   simulieren, Resultate speichern. Läuft auf dem Gerät der Lehrperson. */
async function werteAus(S, code, spiel, entscheideExtra) {
  const basis = `spiele/${code}`;
  const [fR, eR, rsR] = await Promise.all([S.lies(`${basis}/firmen`), S.lies(`${basis}/entscheide/r${spiel.runde}`), S.lies(`${basis}/resultate`)]);
  if (!fR.ok || !eR.ok || !rsR.ok) return { fehler: "Daten konnten nicht geladen werden." };
  const firmen = Object.values(firmenNormal(fR.daten)).sort((a, b) => (a.ki - b.ki) || (a.erstellt - b.erstellt));
  if (!firmen.length) return { fehler: "Es gibt keine Firmen im Spiel." };
  const entscheide = Object.assign({}, eR.daten && typeof eR.daten === "object" ? eR.daten : {}, entscheideExtra || {});
  const resultate = resultateNormal(rsR.daten);
  const e = spiel.einstellungen;
  const zustaende = {};
  for (const f of firmen) {
    const nummern = Object.keys(resultate).map(Number).filter((r) => r < spiel.runde).sort((a, b) => b - a);
    for (const r of nummern) { const x = resultate[r].firmen[f.id]; if (x && x.zustand) { zustaende[f.id] = x.zustand; break; } }
  }
  const prog = Engine.prognose(spiel.runde, spiel.ereignisse, e);
  for (const f of firmen.filter((x) => x.ki)) {
    const z = Engine.zustandVon(zustaende[f.id], e);
    let letztes = null, faktor = 1;
    const nummern = Object.keys(resultate).map(Number).filter((r) => r < spiel.runde).sort((a, b) => b - a);
    for (const r of nummern) { if (resultate[r].firmen[f.id]) { letztes = resultate[r].firmen[f.id]; faktor = num(resultate[r].prognoseFaktor, 1); break; } }
    const d = KI.entscheid(f.id, z, spiel.level, spiel.runde, prog, letztes, faktor);
    entscheide[f.id] = d;
    await S.schreib(`${basis}/entscheide/r${spiel.runde}/${f.id}`, d);
  }
  const res = Engine.simuliere({ firmen, zustaende, entscheide, level: spiel.level, runde: spiel.runde, ereignisse: spiel.ereignisse, einst: e });
  res.zeit = Date.now();
  const w = await S.schreib(`${basis}/resultate/r${spiel.runde}`, res);
  if (!w.ok) return { fehler: "Resultate konnten nicht gespeichert werden." };
  return { res };
}

async function auswerten() {
  const s = App.spiel;
  if (!s || s.status !== "offen") return;
  const fehlen = gruppenListe().filter((f) => !(App.entscheide[f.id] && App.entscheide[f.id].zeit));
  if (fehlen.length) {
    const ok = await frage({ titel: "Trotzdem auswerten?", text: `${fehlen.length === 1 ? "Eine Firma hat" : fehlen.length + " Firmen haben"} noch nicht abgegeben: <b>${fehlen.map((f) => esc(f.logo + " " + f.name)).join(", ")}</b>. Sie arbeiten mit den Entscheidungen des letzten Quartals weiter (Autopilot).`, ja: "Jetzt auswerten" });
    if (!ok) return;
  }
  const S = store(), code = App.sitzung.code;
  if (!(await spielSchreiben({ status: "auswertung" }))) return;
  toast("⏳ Der Markt wird simuliert …");
  await warte(S === FirebaseDB ? 1500 : 60);
  const frisch = await S.lies(`spiele/${code}/spiel`);
  const spiel = frisch.ok ? spielNormal(frisch.daten) : null;
  if (!spiel) { toast("⚠️ Keine Verbindung."); return; }
  const r = await werteAus(S, code, spiel);
  if (r.fehler) { await spielSchreiben({ status: "offen" }); toast("⚠️ " + r.fehler); await Abgleich.tick(true); return; }
  const verlauf = Object.assign({}, spiel.verlauf, { ["r" + spiel.runde]: { level: spiel.level, ereignisse: spiel.ereignisse, zeit: r.res.zeit } });
  await spielSchreiben({ status: "ausgewertet", verlauf });
  App.ergebnisRunde = null;
  toast(`📊 Quartal ${spiel.runde} ist ausgewertet`);
  await Abgleich.tick(true);
}

async function auswertungZuruecknehmen() {
  const s = App.spiel;
  if (!s || s.status !== "ausgewertet") return;
  const ok = await frage({ titel: `Auswertung von Quartal ${s.runde} zurücknehmen?`, text: "Die Resultate dieses Quartals werden gelöscht, das Quartal ist wieder offen. Die Gruppen können ihre Entscheidungen ändern. Nützlich, wenn zu früh ausgewertet wurde.", ja: "Zurücknehmen", gefahr: true });
  if (!ok) return;
  const S = store(), code = App.sitzung.code;
  const r = await S.loesche(`spiele/${code}/resultate/r${s.runde}`);
  if (!r.ok) { toast("⚠️ Keine Verbindung."); return; }
  const verlauf = Object.assign({}, s.verlauf); delete verlauf["r" + s.runde];
  await spielSchreiben({ status: "offen", verlauf });
  toast(`↩️ Quartal ${s.runde} ist wieder offen`);
  await Abgleich.tick(true);
}

async function spielBeenden() {

async function firmaGruenden(werte) {
  const b = App.beitritt;
  const name = text(werte.name, 24).trim().replace(/\s+/g, " ");
  if (name.length < 2) return "Gebt eurer Firma einen Namen (mindestens 2 Zeichen).";
  if (!/^\d{4}$/.test(String(werte.pin || ""))) return "Der PIN besteht aus genau 4 Ziffern.";
  if (String(werte.pin) !== String(werte.pin2)) return "Die beiden PINs stimmen nicht überein.";
  const S = store(b.modus);
  const fR = await S.lies(`spiele/${b.code}/firmen`);
  if (!fR.ok) return "Keine Verbindung – bitte nochmals versuchen.";
  const firmen = firmenNormal(fR.daten);
  if (Object.values(firmen).some((f) => f.name.toLowerCase() === name.toLowerCase())) return "Diesen Firmennamen gibt es schon. Wählt einen anderen.";
  const farbe = DATEN.farben.find((f) => f.id === werte.farbe) || DATEN.farben[0];
  const logo = DATEN.logos.includes(werte.logo) ? werte.logo : DATEN.logos[0];
  const id = neueId("f");
  const r = await S.schreib(`spiele/${b.code}/firmen/${id}`, { id, name, logo, farbe: farbe.hex, farbId: farbe.id, pinHash: pinHash(b.code, werte.pin), erstellt: Date.now() });
  if (!r.ok) return "Speichern fehlgeschlagen – bitte nochmals versuchen.";
  App.entwurf.gruendung = null;
  await gruppeOeffnen(b.code, b.modus, id);
  toast(`🎉 ${logo} ${name} ist gegründet!`);
  return null;
}

async function entscheidAbgeben() {
  const fid = aktiveFirmaId(), code = App.sitzung.code, S = store();
  const s = App.spiel;
  if (!fid || !s) return;
  const schl = entwurfSchluessel();
  const werte = Object.assign({}, formularWerte());
  const frisch = await S.lies(`spiele/${code}/spiel`);
  const aktuell = frisch.ok && frisch.daten ? spielNormal(frisch.daten) : null;
  const d = Object.assign({}, werte, { fid, runde: s.runde, level: s.level, zeit: Date.now() });
  if (App.sitzung.rolle === "lehrer") d.erfasstVon = "lehrperson";
  if (frisch.ok && aktuell && (aktuell.status !== "offen" || aktuell.runde !== s.runde)) {
    toast("⏳ Dieses Quartal ist nicht mehr offen – die Abgabe wurde nicht gespeichert.", 4500);
    await Abgleich.tick(true);
    return;
  }
  const pfad = `spiele/${code}/entscheide/r${s.runde}/${fid}`;
  const r = frisch.ok ? await S.schreib(pfad, d) : { ok: false };
  if (!r.ok) {
    Lokal.schreib(`voltage:ausstehend:${code}:${fid}:r${s.runde}`, { pfad, wert: d, runde: s.runde, hinweis: `✅ Abgabe für Quartal ${s.runde} nachgeliefert` });
    App.eigenerEntscheid = d;
    toast("📶 Keine Verbindung – eure Abgabe ist gespeichert und wird automatisch übertragen.", 5000);
  } else {
    App.eigenerEntscheid = d;
    toast(`🚀 Entscheidungen für Quartal ${s.runde} abgegeben!`);
  }
  delete App.entwurf[schl];
  Lokal.loesche("voltage:entwurf:" + schl);
  if (App.sitzung.rolle === "lehrer") App.entscheide[fid] = d;
  zeichne();
}

function eingabeDialog({ titel, text: txt, muster, typ, platzhalter }) {
  return new Promise((aufloesen) => {
    const hg = document.createElement("div");
    hg.className = "dialog-hg";
    hg.innerHTML = `<form class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-e">
      <h2 id="dlg-e">${esc(titel)}</h2>${txt ? `<p>${esc(txt)}</p>` : ""}
      <input id="dlg-feld" type="text" autocomplete="off" ${typ ? `inputmode="${typ}"` : ""} ${muster ? `pattern="${muster}"` : ""} placeholder="${esc(platzhalter || "")}" required>
      <div class="zeile"><button class="knopf" type="submit"><span>Speichern</span></button>
      <button class="knopf zweit" type="button" data-w="0"><span>Abbrechen</span></button></div></form>`;
    const zu = (w) => { hg.remove(); aufloesen(w); };
    hg.querySelector("form").addEventListener("submit", (e) => { e.preventDefault(); zu(hg.querySelector("#dlg-feld").value.trim()); });
    hg.addEventListener("click", (e) => { if (e.target.closest("[data-w='0']") || e.target === hg) zu(null); });
    document.body.append(hg);
    hg.querySelector("#dlg-feld").focus();
  });
}

function tickerHtml() {

function phasenHtml() {

  const gespielt = new Set(Object.values(s.verlauf).map((v) => v.level));
  const jetzt = s.status === "vorbereitung" ? "einstieg" : s.status === "beendet" ? "transfer" : "l" + s.level;

function balken(wert, klasse, markierung) {

  return `<div class="balken ${klasse || "neutral"}"><i style="width:${w}%"></i>${markierung != null ? `<span class="mark" style="left:calc(${klemme(num(markierung), 0, 100)}% - 1px)"></span>` : ""}</div>`;
}
function dimsHtml(p, alt) {
  const reihe = (k, lbl, cls) => `<div class="dim"><div class="t"><span>${lbl}</span><span class="zahl">${p[k]}${alt ? ` <span class="${p[k] - alt[k] >= 0 ? "pos" : "neg"} mini">(${vorz(p[k] - alt[k])})</span>` : ""}</span></div>${balken(p[k], cls, alt ? alt[k] : null)}</div>`;
  return `<div class="dims">${reihe("wirtschaft", "💰 Wirtschaft", "w")}${reihe("umwelt", "🌱 Umwelt", "u")}${reihe("gesellschaft", "🤝 Gesellschaft", "g")}</div>`;
}
// Nachhaltigkeitsdreieck: je weiter aussen, desto besser
function dreieckSvg(p, alt) {
  const cx = 150, cy = 118, R = 84;
  const ecken = [["wirtschaft", "Wirtschaft", -90, "--dim-w"], ["umwelt", "Umwelt", 150, "--dim-u"], ["gesellschaft", "Gesellschaft", 30, "--dim-g"]];
  const pt = (a, r) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const poly = (werte) => ecken.map(([k, , a]) => pt(a, R * klemme(num(werte[k]), 0, 100) / 100).map((v) => v.toFixed(1)).join(",")).join(" ");
  const rahmen = (f) => ecken.map(([, , a]) => pt(a, R * f).map((v) => v.toFixed(1)).join(",")).join(" ");
  const labels = ecken.map(([k, lbl, a, farbe]) => {
    const [x, y] = pt(a, R + 18);
    const anker = a === -90 ? "middle" : a > 90 ? "start" : "end";
    const dy = a === -90 ? -4 : 14;
    const xx = a === -90 ? x : a > 90 ? x - 26 : x + 26;
    return `<text x="${xx.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anker}" style="fill:var(${farbe})">${lbl} ${num(p[k])}</text>`;
  }).join("");
  return `<svg class="dreieck" viewBox="0 0 300 196" role="img" aria-label="Nachhaltigkeitsdreieck: Wirtschaft ${p.wirtschaft}, Umwelt ${p.umwelt}, Gesellschaft ${p.gesellschaft} Punkte">
    <polygon points="${rahmen(1)}" style="fill:var(--raised);stroke:var(--line-strong)" stroke-width="1.5"/>
    <polygon points="${rahmen(0.5)}" style="fill:none;stroke:var(--line)" stroke-width="1" stroke-dasharray="4 4"/>
    ${ecken.map(([, , a]) => { const [x, y] = pt(a, R); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/>`; }).join("")}
    ${alt ? `<polygon points="${poly(alt)}" style="fill:none;stroke:var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>` : ""}
    <polygon points="${poly(p)}" style="fill:var(--volt);fill-opacity:.55;stroke:var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    ${labels}</svg>`;
}
function schoeneTicks(min, max, n) {
  const spanne = max - min || 1, roh = spanne / n, mag = Math.pow(10, Math.floor(Math.log10(roh))), norm = roh / mag;
  const schritt = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(min / schritt) * schritt; v <= Math.ceil(max / schritt) * schritt + schritt / 2; v += schritt) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}
// Liniendiagramm als SVG (kein externes Paket nötig)
function linienSvg({ serien, labels, hoehe = 210, titel = "Diagramm", format = fmt }) {
  const werte = serien.flatMap((s) => s.werte.filter((v) => v != null && Number.isFinite(v)));
  if (!werte.length || !labels.length) return `<p class="gedaempft klein">Noch keine Daten – nach dem ersten ausgewerteten Quartal erscheint hier das Diagramm.</p>`;
  const W = 480, H = hoehe, L = 64, Rr = 14, T = 12, B = 28;
  let min = Math.min(0, ...werte), max = Math.max(0, ...werte);
  if (max === min) max = min + 1;
  const ticks = schoeneTicks(min, max, 4);
  min = ticks[0]; max = ticks[ticks.length - 1];
  const x = (i) => labels.length === 1 ? L + (W - L - Rr) / 2 : L + i * (W - L - Rr) / (labels.length - 1);
  const y = (v) => T + (max - v) / (max - min) * (H - T - B);
  let svg = `<svg class="diagramm" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titel)}">`;
  for (const t of ticks) svg += `<line class="${t === 0 ? "null" : "gitter"}" x1="${L}" x2="${W - Rr}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${L - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${esc(format(t))}</text>`;
  labels.forEach((l, i) => { svg += `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`; });
  for (const s of serien) {
    const punkte = s.werte.map((v, i) => (v == null || !Number.isFinite(v) ? null : [x(i), y(v)]));
    let d = "", offen = false;
    for (const p of punkte) { if (!p) { offen = false; continue; } d += (offen ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1) + " "; offen = true; }
    if (d) svg += `<path d="${d}" fill="none" style="stroke:var(--halo)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" style="stroke:${farbeGueltig(s.farbe)}" stroke-width="${s.dick ? 3.5 : 2.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const letzter = [...punkte].reverse().find(Boolean);
    if (letzter) svg += `<circle cx="${letzter[0].toFixed(1)}" cy="${letzter[1].toFixed(1)}" r="4.5" style="fill:${farbeGueltig(s.farbe)};stroke:var(--surface)" stroke-width="2"/>`;
  }
  svg += "</svg>";
  const legende = serien.length > 1 ? `<div class="legende">${serien.map((s) => `<span><span class="farbe" style="background:${farbeGueltig(s.farbe)}"></span>${esc(s.name)}</span>`).join("")}</div>` : "";
  return svg + legende;
}
function kurzFr(v) { return Math.abs(v) >= 1000 ? fmt(v / 1000) + "k" : fmt(v); }

/* ---------- Erklärungen zum Quartalsbericht ---------- */
function erklaerungen(x, R, level) {
  const out = [], d = x.entscheid || {}, r = R_();
  const add = (typ, ic, t) => out.push({ typ, ic, t });
  if (!x.abgegeben) add("info", "🤖", "Ihr habt nicht abgegeben – der Autopilot hat eure letzten Entscheidungen wiederholt.");
  if (num(d.menge) > x.kapazitaet) add("schlecht", "🏭", `Ihr wolltet ${fmt(d.menge)} Dosen herstellen, eure Kapazität reichte aber nur für ${fmt(x.kapazitaet)}.`);
  if (x.ausverkauft) add("schlecht", "🔥", `Ausverkauft! Ihr hättet ${fmt(x.fehlmenge)} Dosen mehr verkaufen können. Ein Teil dieser Kundschaft kaufte bei der Konkurrenz.`);
  if (x.zusatz > 0) add("gut", "🛒", `${fmt(x.zusatz)} Dosen gingen an Kundschaft, die bei der Konkurrenz nichts mehr fand.`);
  if (x.lagerNeu > 0) add("info", "📦", `${fmt(x.lagerNeu)} Dosen liegen jetzt im Lager (Lagerkosten ${fr(x.kosten.lager)}). Ihr könnt sie im nächsten Quartal verkaufen – plant die Produktion entsprechend.`);
  if (x.restposten > 0) add("schlecht", "🗑️", `${fmt(x.restposten)} Dosen passten nicht mehr ins Lager und wurden für ${preis(r.restpostenPreis)} verramscht. Das kostet Geld, belastet die Umwelt und schadet dem Image.`);
  const preise = Object.values(R.firmen).map((y) => num(y.entscheid && y.entscheid.preis)).filter((v) => v > 0);
  const schnitt = preise.length ? preise.reduce((a, b) => a + b, 0) / preise.length : r.referenzpreis;
  if (d.preis < x.stueckkosten) add("schlecht", "⚠️", `Euer Preis (${preis(d.preis)}) liegt unter den Kosten pro Dose (${preis(x.stueckkosten)}): Jede verkaufte Dose bringt Verlust.`);
  else if (d.preis > schnitt * 1.15) add("info", "💸", `Euer Preis liegt deutlich über dem Marktschnitt von ${preis(schnitt)} Das schreckt einen Teil der Kundschaft ab – ausser Qualität, Image und Bekanntheit überzeugen.`);
  else if (d.preis < schnitt * 0.88) add("info", "🏷️", `Euer Preis liegt deutlich unter dem Marktschnitt von ${preis(schnitt)} Ihr gewinnt Kundschaft, verdient aber weniger pro Dose.`);
  if (level >= 2) {
    const b0 = num(x.vorher && x.vorher.bekanntheit), b1 = num(x.zustand && x.zustand.bekanntheit);
    if (x.kosten.marketing === 0) add("schlecht", "📣", `Ohne Werbung sinkt eure Bekanntheit: ${prozent(b0)} → ${prozent(b1)}.`);
    else add(b1 >= b0 ? "gut" : "info", "📣", `Bekanntheit: ${prozent(b0)} → ${prozent(b1)} (Werbung ${fr(x.kosten.marketing)}).`);
  }
  if (x.gekuendigt) add("schlecht", "🚪", "Wegen der tiefen Zufriedenheit hat eine Person gekündigt – eure Kapazität ist gesunken.");
  if (x.eingestellt) add("info", "👋", `${x.eingestellt === 1 ? "Eine neue Person" : x.eingestellt + " neue Personen"} eingestellt (Einarbeitung ${fr(x.eingestellt * r.einstellungskosten)}).`);
  if (x.entlassen) add("schlecht", "📉", `${x.entlassen === 1 ? "Eine Person" : x.entlassen + " Personen"} entlassen. Das spart Lohn, drückt aber die Stimmung im Team und euren Ruf.`);
  if (level >= 3) {
    const z0 = num(x.vorher && x.vorher.zufriedenheit), z1 = num(x.zustand && x.zustand.zufriedenheit);
    add(z1 >= z0 ? "gut" : "schlecht", "😊", `Zufriedenheit im Team: ${Math.round(z0)} → ${Math.round(z1)}${z1 < 35 ? " – Achtung: Unter 30 kündigen Leute!" : ""}.`);
  }
  if (x.jugendschutzMalus) add("schlecht", "🏫", "Viel Social-Media-Werbung während der Jugendschutz-Debatte hat eurem Image geschadet.");
  if (x.influencer) add("gut", "⭐", "Ihr habt den Influencer-Deal gewonnen: Image +8!");
  if (x.investition) add("info", "🏗️", `Investiert: ${fr(x.investition)} Die Anlage verliert über ${r.abschreibungQuartale} Quartale an Wert (Abschreibung).`);
  if (x.notkredit) add("schlecht", "🏦", `Die Kasse war leer: Die Bank gewährte einen Notkredit über ${fr(x.notkredit)} (inkl. ${fr(r.kredit.notkreditGebuehr)} Gebühr). Er kostet 2% Zins pro Quartal.`);
  const be = d.preis > 0 ? Math.ceil(Math.max(0, x.kostenTotal - x.umsatzRest) / d.preis) : 0;
  if (x.gewinn >= 0) add("gut", "✅", `Gewinn von ${fr(x.gewinn)} Gewinnschwelle: ${fmt(be)} verkaufte Dosen – verkauft habt ihr ${fmt(x.verkauft)}.`);
  else add("schlecht", "📉", `Verlust von ${fr(-x.gewinn)} Um die Kosten zu decken, hättet ihr ${fmt(be)} Dosen verkaufen müssen (verkauft: ${fmt(x.verkauft)}).`);
  return out;
}

/* ---------- Kontrollraum der Lehrperson ---------- */
function klassenLink() {
  if (!location.protocol.startsWith("http")) return "";
  const u = new URL(location.origin + location.pathname);
  u.searchParams.set("spiel", App.sitzung.code);
  if (App.sitzung.modus === "online" && !gueltigeDbUrl(KONFIG.firebaseUrl)) u.searchParams.set("db", onlineAdresse());
  return u.toString();
}

  const s = App.spiel;

    rechts: `<button class="iknopf" data-act="aktualisieren" aria-label="Aktualisieren">🔄<span class="t">Aktualisieren</span></button><button class="iknopf" data-act="abmelden" aria-label="Abmelden">🚪<span class="t">Abmelden</span></button>` });

  const pane = { cockpit: lehrerCockpit, ergebnisse: lehrerErgebnisse, rangliste: lehrerRangliste, eingaben: lehrerEingaben, reflexion: lehrerReflexion, regeln: anleitungInhalt, verwaltung: lehrerVerwaltung }[App.tabL] || lehrerCockpit;

    ${tickerHtml()}${tabsHtml(tabs, App.tabL, "tabL")}<div class="stapel">${pane()}</div></main>`;
}

function rundenPlaner(n) {
  const plan = App.entwurf.runde || (App.entwurf.runde = { ereignisse: [] });
  const level = klemme(num(plan.level, vorgeschlagenesLevel(n)), 1, 5);
  const ld = levelDaten(level);
  const gewaehlt = liste(plan.ereignisse).filter((k) => DATEN.ereignisse[k] && DATEN.ereignisse[k].abLevel <= level);
  const pr = Engine.prognose(n, gewaehlt, einst());
  return `<div class="bereich">
    <div class="zwischen"><h3>Quartal ${n} planen</h3>${pr.saison.name ? `<span class="chip">${pr.saison.ic} ${esc(pr.saison.name)}</span>` : ""}</div>
    <label class="feld"><span class="t">Level</span><select id="plan-level" data-plan="level">
      ${DATEN.level.map((l) => `<option value="${l.nr}" ${l.nr === level ? "selected" : ""}>Level ${l.nr} – ${esc(l.titel)}${l.nr === vorgeschlagenesLevel(n) ? " (vorgeschlagen)" : ""}</option>`).join("")}</select></label>
    <p class="klein"><b>${ld.ic} ${esc(ld.titel)}:</b> ${esc(ld.ziel)} <span class="gedaempft">Neu: ${ld.neu.map(esc).join(", ")}.</span></p>
    <div class="zwischen"><h3>Marktereignisse (höchstens 2)</h3><button class="textknopf" type="button" data-act="zufallsEreignis">🎲 Zufall</button></div>
    <div class="ereignisse">${Object.entries(DATEN.ereignisse).map(([k, e]) => {
      const gesperrt = e.abLevel > level;
      return `<button type="button" class="ereignis" data-act="ereignis" data-ev="${k}" aria-pressed="${gewaehlt.includes(k)}" ${gesperrt ? "disabled" : ""}>
        <span class="ic" aria-hidden="true">${e.ic}</span><span><b>${esc(e.name)}</b><br><span class="klein gedaempft">${gesperrt ? `ab Level ${e.abLevel}` : esc(e.text)}</span></span></button>`;
    }).join("")}</div>
    <p class="hinweis klein">📈 Prognose für die Gruppen: rund <b>${fmt(pr.richtwert)} Dosen</b> pro Firma bei marktüblichem Auftritt${pr.saison.name ? ` (${esc(pr.saison.name)}${gewaehlt.length ? " und Ereignisse" : ""})` : ""}.</p>
    <div><button class="knopf" data-act="rundeOeffnen"><span>Quartal ${n} freischalten 🔓</span></button></div>
  </div>`;
}

function lehrerCockpit() {
  const s = App.spiel, gruppen = gruppenListe(), alle = firmenListe();
  const abgaben = alle.filter((f) => !f.ki && App.entscheide[f.id] && App.entscheide[f.id].zeit);
  let schritt = "";
  if (s.status === "vorbereitung") {
    const checks = gruppen.filter((f) => f.startcheck).length;
    schritt = `<h2>🧭 Phase 1 · Einstieg</h2>
      <p>Die Gruppen gründen ihre Firmen und lösen den Start-Check (${checks} von ${gruppen.length} erledigt). Bereit sind <b>${gruppen.length} ${gruppen.length === 1 ? "Firma" : "Firmen"}</b>${s.einstellungen.ki ? ` und ${s.einstellungen.ki} Computer-Konkurrenz` : ""}.</p>
      ${rundenPlaner(1)}`;
  } else if (s.status === "offen") {
    const fehlen = gruppen.filter((f) => !abgaben.includes(f));
    const anteil = gruppen.length ? Math.round(abgaben.length / gruppen.length * 100) : 100;
    schritt = `<h2>⏱️ Quartal ${s.runde} läuft</h2>
      <p class="klein gedaempft">Level ${s.level} · ${esc(levelDaten(s.level).titel)} · ${s.ereignisse.length ? s.ereignisse.map((k) => DATEN.ereignisse[k].ic + " " + esc(DATEN.ereignisse[k].name)).join(" · ") : "keine Ereignisse"}</p>
      <div class="zwischen"><b>Abgaben: ${abgaben.length} von ${gruppen.length}</b><span class="zahl">${anteil}%</span></div>
      <div class="fortschritt"><i style="width:${anteil}%"></i></div>
      ${fehlen.length ? `<p class="klein">⏳ Es fehlen: ${fehlen.map((f) => esc(f.logo + " " + f.name)).join(", ")}</p>` : `<p class="hinweis gut">✅ Alle Gruppen haben abgegeben.</p>`}
      <div class="zeile"><button class="knopf" data-act="auswerten"><span>📊 Quartal ${s.runde} auswerten</span></button>
        <button class="knopf zweit klein" data-act="tabL" data-tab="eingaben"><span>📝 Eingaben ansehen</span></button></div>
      <p class="mini gedaempft">Firmen ohne Abgabe arbeiten mit den Entscheidungen des letzten Quartals weiter (Autopilot). Die Computer-Konkurrenz entscheidet bei der Auswertung.</p>`;
  } else if (s.status === "auswertung") {
    schritt = `<h2>⏳ Auswertung läuft …</h2><p>Der Markt wird simuliert. Falls das hängen bleibt (z.B. Verbindung weg), hier weitermachen:</p>
      <div class="zeile"><button class="knopf" data-act="auswertenFortsetzen"><span>Auswertung erneut starten</span></button>
      <button class="knopf zweit klein" data-act="auswertungAbbrechen"><span>Zurück zu «offen»</span></button></div>`;
  } else if (s.status === "ausgewertet") {
    const R = App.resultate[s.runde];
    const levelFertig = vorgeschlagenesLevel(s.runde + 1) !== s.level || s.level === 5 && s.runde >= 5 * s.einstellungen.rundenProLevel;
    const letzte = s.runde >= 5 * s.einstellungen.rundenProLevel;
    let zusammenfassung = "";
    if (R) {
      const best = Object.entries(R.firmen).sort((a, b) => b[1].gewinn - a[1].gewinn)[0];
      zusammenfassung = `<p class="klein">Verkauft: <b>${fmt(Object.values(R.firmen).reduce((a, x) => a + x.verkauft, 0))} Dosen</b> · Höchster Gewinn: ${best ? firmaLabel(firmaVon(best[0])) + " " + fr(best[1].gewinn) : "–"}</p>`;
    }
    schritt = `<h2>📊 Quartal ${s.runde} ist ausgewertet</h2>${zusammenfassung}
      <p class="klein gedaempft">Die Gruppen lesen jetzt ihren Quartalsbericht. Besprecht die Ergebnisse gemeinsam (Tab «Ergebnisse» am Beamer).</p>
      ${levelFertig ? `<p class="hinweis">💬 <b>Level ${s.level} ist abgeschlossen.</b> Die Gruppen beantworten jetzt die Reflexionsfragen – ihre Antworten erscheinen im Tab «Reflexion».</p>` : ""}
      ${letzte ? `<p class="hinweis achtung">🏁 Alle geplanten Quartale sind gespielt. Zeit für die Transferphase!</p>` : ""}
      ${rundenPlaner(s.runde + 1)}
      <div class="zeile"><button class="knopf ${letzte ? "" : "zweit"}" data-act="spielBeenden"><span>🏁 Spiel beenden → Transfer</span></button>
        <button class="knopf zweit klein" data-act="auswertungZurueck"><span>↩️ Auswertung zurücknehmen</span></button></div>`;
  } else if (s.status === "beendet") {
    schritt = `<h2>🎓 Phase 3 · Transfer</h2>
      <p>Das Planspiel ist beendet. Die Gruppen sehen ihre Schlussbilanz und beantworten die Transferfragen.</p>
      <div class="zeile"><button class="knopf" data-act="tabL" data-tab="rangliste"><span>🏆 Siegerehrung</span></button>
        <button class="knopf zweit" data-act="tabL" data-tab="reflexion"><span>💬 Antworten ansehen</span></button>
        <button class="knopf zweit klein" data-act="spielFortsetzen"><span>▶ Spiel fortsetzen</span></button></div>`;
  }
  const link = klassenLink();
  const zugang = `<h2>📲 Zugang für die Gruppen</h2>
    ${App.sitzung.modus === "online" ? `<p>Spielcode: <span class="code">${esc(App.sitzung.code)}</span></p>
      ${link ? `<p class="klein" style="overflow-wrap:anywhere"><span class="zahl">${esc(link)}</span></p><div class="zeile"><button class="knopf zweit klein" data-act="linkKopieren"><span>📋 Link kopieren</span></button></div>` : ""}
      <p class="klein gedaempft">Die Gruppen öffnen den Link oder die App und geben den Code ein.</p>`
    : `<p>Spielcode: <span class="code">${esc(App.sitzung.code)}</span></p>
      <p class="klein">📱 <b>Ein-Geräte-Modus:</b> Die Gruppen melden sich auf <b>diesem Gerät</b> an (Startseite → Gruppe) – oder ihr erfasst ihre Entscheidungsblätter über «Als Gruppe öffnen».</p>
      <div class="zeile"><button class="knopf zweit klein" data-act="druckBlatt"><span>🖨️ Entscheidungsblatt</span></button></div>`}`;
  const tabelle = `<div class="tabwrap"><table><thead><tr><th>Firma</th><th>Abgabe Q${s.runde || 1}</th><th class="z">Kasse</th><th class="z">Gewinn letztes Q</th><th class="z">Punkte</th><th></th></tr></thead><tbody>
    ${alle.map((f) => {
      const e = App.entscheide[f.id], l = letztesResultat(f.id), z = l ? l.res.zustand : null;
      const abg = s.status === "offen" || s.status === "auswertung" ? (f.ki ? '<span class="gedaempft klein">bei Auswertung</span>' : e && e.zeit ? `✅ <span class="klein">${uhrzeit(e.zeit)}${e.erfasstVon ? " (erfasst)" : ""}</span>` : "⏳") : "–";
      return `<tr><td>${firmaLabel(f)}</td><td>${abg}</td><td class="z">${fr(z ? z.kasse : einst().startkapital)}</td><td class="z ${l ? (l.res.gewinn >= 0 ? "pos" : "neg") : ""}">${l ? fr(l.res.gewinn) : "–"}</td><td class="z">${punkteAktuell(f.id).gesamt}</td>
        <td>${f.ki ? "" : `<button class="knopf zweit klein" data-act="alsGruppe" data-fid="${esc(f.id)}"><span>👁️ Als Gruppe öffnen</span></button>`}</td></tr>`;

function rundenWahl(aktiv, act) {

  return `<div class="zeile nicht-drucken" role="group" aria-label="Quartal wählen">${runden.map((r) => `<button class="tab" data-act="${act}" data-runde="${r}" aria-selected="${r === aktiv}">Q${r}</button>`).join("")}</div>`;
}
function lehrerErgebnisse() {

  const verkauft = zeilen.reduce((a, [, x]) => a + x.verkauft, 0), nachfrage = zeilen.reduce((a, [, x]) => a + x.nachfrage, 0);
  const schnittPreis = zeilen.reduce((a, [, x]) => a + num(x.entscheid.preis), 0) / (zeilen.length || 1);
  const serien = (fn) => firmenListe().map((f) => ({ name: f.logo + " " + f.name, farbe: f.farbe, werte: runden.map((q) => { const x = App.resultate[q].firmen[f.id]; return x ? fn(x) : null; }) }));
