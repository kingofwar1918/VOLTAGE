      <div class="raster r4">${kpi("Nachfrage total", fmt(nachfrage), "Dosen")}${kpi("Verkauft total", fmt(verkauft), "Dosen")}${kpi("Durchschnittspreis", preis(schnittPreis))}${kpi("Firmen im Markt", zeilen.length)}</div>
      <div class="tabwrap"><table><thead><tr><th>Firma</th><th class="z">Preis</th><th class="z">Produziert</th><th class="z">Nachfrage</th><th class="z">Verkauft</th><th class="z">Anteil</th><th class="z">Umsatz</th><th class="z">Gewinn</th><th class="z">Kasse</th><th class="z">💰</th><th class="z">🌱</th><th class="z">🤝</th><th class="z">Gesamt</th></tr></thead><tbody>
        ${zeilen.map(([fid, x]) => `<tr><td>${firmaLabel(firmaVon(fid))}</td><td class="z">${num(x.entscheid.preis).toFixed(2)}</td><td class="z">${fmt(x.produziert)}</td><td class="z">${fmt(x.nachfrage)}</td>
          <td class="z">${fmt(x.verkauft)}${x.ausverkauft ? " 🔥" : ""}</td><td class="z">${x.marktanteil}%</td><td class="z">${fmt(x.umsatz)}</td><td class="z ${x.gewinn >= 0 ? "pos" : "neg"}">${fmt(x.gewinn)}</td>
          <td class="z">${fmt(x.zustand.kasse)}</td><td class="z">${x.punkte.wirtschaft}</td><td class="z">${x.punkte.umwelt}</td><td class="z">${x.punkte.gesellschaft}</td><td class="z"><b>${x.punkte.gesamt}</b></td></tr>`).join("")}
      </tbody></table></div></section>
    <div class="raster rd">
      <section class="karte"><h3>Gewinn pro Quartal (Fr.)</h3>${linienSvg({ serien: serien((x) => x.gewinn), labels, titel: "Gewinn pro Quartal", format: kurzFr })}</section>
      <section class="karte"><h3>Gesamtpunkte Nachhaltigkeit</h3>${linienSvg({ serien: serien((x) => x.punkte.gesamt), labels, titel: "Gesamtpunkte" })}</section>
      <section class="karte"><h3>Kasse (Fr.)</h3>${linienSvg({ serien: serien((x) => x.zustand.kasse), labels, titel: "Kasse", format: kurzFr })}</section>
      <section class="karte"><h3>Marktanteil (%)</h3>${linienSvg({ serien: serien((x) => x.marktanteil), labels, titel: "Marktanteil" })}</section>
    </div>`;

// Beste Firma(en) pro Bereich – bei Gleichstand alle, bei mehr als drei «Gleichstand»
function besteIn(rl, k) {
  if (!rl.length) return { werte: [], max: 0 };
  const max = Math.max(...rl.map((e) => e.p[k]));
  return { werte: rl.filter((e) => e.p[k] === max), max };
}
function siegerKategorien(rl) {
  if (!rl.length) return "";
  const kat = [["wirtschaft", "💰 Wirtschaftlich stärkste Firma"], ["umwelt", "🌱 Umweltfreundlichste Firma"], ["gesellschaft", "🤝 Sozialste Firma"]];
  return `<div class="raster r3">${kat.map(([k, t]) => {
    const b = besteIn(rl, k);
    const wer = b.werte.length > 3 ? `<span class="gedaempft">Gleichstand von ${b.werte.length} Firmen</span>` : b.werte.map((e) => firmaLabel(e.f)).join("<br>");
    return `<div class="kpi"><div class="lbl">${t}</div><div style="margin-top:6px">${wer}</div><div class="sub">${b.max} Punkte</div></div>`;
  }).join("")}</div>`;
}
function podestHtml(rl) {
  if (rl.length < 1) return "";
  const platz = (i, cls) => { const e = rl[i]; if (!e) return `<div class="platz ${cls}"></div>`; return `<div class="platz ${cls}"><span class="logo">${esc(e.f.logo)}</span><span class="nm">${esc(e.f.name)}</span><span class="zahl klein">${e.wert} Punkte</span><div class="sockel">${i + 1}</div></div>`; };
  return `<div class="podest">${platz(1, "p2")}${platz(0, "p1")}${platz(2, "p3")}</div>`;
}
function lehrerRangliste() {
  const rl = rangliste(), s = App.spiel, gewinn = s.einstellungen.wertung === "gewinn";
  return `<section class="karte stapel"><div class="kopf"><h2>🏆 ${s.status === "beendet" ? "Siegerehrung" : "Rangliste"}</h2>
      <span class="klein gedaempft">Wertung: ${gewinn ? "nur Wirtschaft" : "Gesamtpunkte (schwächster Bereich zählt doppelt)"}</span></div>
      ${podestHtml(rl)}</section>
    <section class="karte stapel"><h3>Beste Firma pro Bereich</h3>${siegerKategorien(rl)}</section>
    <section class="karte"><div class="tabwrap"><table><thead><tr><th>#</th><th>Firma</th><th class="z">${gewinn ? "💰 Punkte" : "Gesamt"}</th><th class="z">💰</th><th class="z">🌱</th><th class="z">🤝</th><th class="z">Gewinn total</th><th class="z">Erfolge</th></tr></thead><tbody>
      ${rl.map((e, i) => `<tr><td class="zahl">${i + 1}${i === 0 ? " 👑" : ""}</td><td>${firmaLabel(e.f)}</td><td class="z"><b>${e.wert}</b></td><td class="z">${e.p.wirtschaft}</td><td class="z">${e.p.umwelt}</td><td class="z">${e.p.gesellschaft}</td>
        <td class="z ${e.gewinnTotal >= 0 ? "pos" : "neg"}">${fmt(e.gewinnTotal)}</td><td class="z">${erfolgeVon(e.f.id).filter((x) => x.erreicht).map((x) => x.ic).join("") || "–"}</td></tr>`).join("")}
    </tbody></table></div></section>`;
}

function entscheidZeile(f, d, mitKnopf) {
  const lohnTxt = { tief: "tief", mittel: "mittel", hoch: "hoch" };
  if (!d) return `<tr><td>${firmaLabel(f)}</td><td colspan="8" class="gedaempft klein">${f.ki ? "entscheidet bei der Auswertung" : "noch keine Abgabe"}</td><td>${mitKnopf && !f.ki ? `<button class="knopf zweit klein" data-act="alsGruppe" data-fid="${esc(f.id)}"><span>✏️ Erfassen</span></button>` : ""}</td></tr>`;
  const extras = [d.zutaten === "bio" ? "Bio" : "", d.dose === "recycling" ? "♻️" : "", d.rezeptur === "zuckerreduziert" ? "🍬↓" : "", d.investAnlage ? "🏭+" : "", d.investSolar ? "☀️" : "", num(d.lernende) ? num(d.lernende) + " Lern." : ""].filter(Boolean).join(" ");
  return `<tr><td>${firmaLabel(f)}</td><td class="z">${fmt(d.menge)}</td><td class="z">${num(d.preis).toFixed(2)}</td><td class="z">${fmt(num(d.social) + num(d.plakat) + num(d.sponsoring))}</td>
    <td class="z">${num(d.personal) ? vorz(d.personal) : "–"}</td><td>${lohnTxt[d.lohn] || "–"}</td><td class="z">${num(d.weiterbildung) ? fmt(d.weiterbildung) : "–"}</td>
    <td class="klein">${extras || "–"}</td><td class="z">${num(d.kreditNeu) ? "+" + fmt(d.kreditNeu) : num(d.kreditRueck) ? "−" + fmt(d.kreditRueck) : "–"}</td>

}
function entscheidKopf() { return `<thead><tr><th>Firma</th><th class="z">Menge</th><th class="z">Preis</th><th class="z">Werbung</th><th class="z">Personal</th><th>Lohn</th><th class="z">Weiterb.</th><th>Umwelt / Führung</th><th class="z">Kredit</th><th></th></tr></thead>`; }
function lehrerEingaben() {
  const s = App.spiel, runden = rundenListe().slice().reverse();
  let html = "";
  if (s.status === "offen" || s.status === "auswertung") {
    html += `<section class="karte stapel"><div class="kopf"><h2>Quartal ${s.runde} <span class="chip offen">offen</span></h2><button class="knopf zweit klein" data-act="druckBlatt"><span>🖨️ Entscheidungsblatt Level ${s.level}</span></button></div>

  } else html += `<div class="zeile"><button class="knopf zweit klein" data-act="druckBlatt"><span>🖨️ Entscheidungsblatt drucken</span></button></div>`;
  for (const r of runden) {

    html += `<details class="aufklapp"><summary>Quartal ${r} · Level ${R.level}</summary><div class="inhalt"><div class="tabwrap"><table>${entscheidKopf()}<tbody>
      ${Object.entries(R.firmen).map(([fid, x]) => entscheidZeile(firmaVon(fid) || { id: fid, name: "(entfernt)", logo: "", farbe: "#999999" }, x.entscheid, false).replace("</td>", x.abgegeben ? "</td>" : ' <span class="chip">Autopilot</span></td>')).join("")}
    </tbody></table></div></div></details>`;

function antwortenBlock(teil, fragen) {
  const proFirma = (App.reflexion || {})[teil] || {};
  const firmen = gruppenListe();
  return fragen.map((q, i) => `<div class="stapel" style="gap:6px"><b>${i + 1}. ${esc(q)}</b><ul class="notizen">
    ${firmen.map((f) => { const a = proFirma[f.id] && proFirma[f.id].antworten ? proFirma[f.id].antworten["f" + i] : ""; return `<li class="${a ? "info" : ""}"><span>${firmaLabel(f)}</span><span style="white-space:pre-wrap">${a ? esc(a) : '<span class="gedaempft">–</span>'}</span></li>`; }).join("")}
  </ul></div>`).join("<hr>");
}
function lehrerReflexion() {
  const gespielt = [...new Set(Object.values(App.spiel.verlauf).map((v) => v.level))].sort();
  const gruppen = gruppenListe();
  let html = `<section class="karte stapel"><div class="kopf"><h2>🧭 Start-Check</h2><button class="knopf zweit klein" data-act="exportReflexion"><span>⬇️ Antworten als CSV</span></button></div>
    <div class="tabwrap"><table><tbody>${gruppen.map((f) => `<tr><td>${firmaLabel(f)}</td><td class="z">${f.startcheck ? `${f.startcheck.punkte} / ${f.startcheck.total}` : "–"}</td></tr>`).join("") || '<tr><td class="gedaempft">Noch keine Gruppen.</td></tr>'}</tbody></table></div></section>`;
  for (const l of gespielt) {
    const ld = levelDaten(l);
    const anzahl = Object.keys((App.reflexion || {})["l" + l] || {}).length;
    html += `<details class="aufklapp" ${l === App.spiel.level ? "open" : ""}><summary>${ld.ic} Level ${l} · ${esc(ld.titel)} <span class="chip">${anzahl}/${gruppen.length}</span></summary><div class="inhalt stapel">${antwortenBlock("l" + l, ld.reflexion)}</div></details>`;
  }
  if (App.spiel.status === "beendet") {
    const anzahl = Object.keys((App.reflexion || {}).transfer || {}).length;
    html += `<details class="aufklapp" open><summary>🎓 Transfer <span class="chip">${anzahl}/${gruppen.length}</span></summary><div class="inhalt stapel">${antwortenBlock("transfer", DATEN.transfer)}</div></details>`;
  }
  if (!gespielt.length) html += `<section class="karte"><p class="gedaempft">Die Reflexionsfragen erscheinen, sobald das erste Quartal eines Levels ausgewertet ist.</p></section>`;
  return html;
}

/* ---------- Ansicht der Gruppe ---------- */
function ansichtGruppe() {
  const s = App.spiel, fid = aktiveFirmaId(), f = firmaVon(fid);
  const lehrer = App.sitzung.rolle === "lehrer";
  const rechts = lehrer ? `<button class="iknopf" data-act="zurueckKontrollraum">🎛️<span class="t">Kontrollraum</span></button>`
    : `<button class="iknopf" data-act="abmelden" aria-label="Abmelden">🚪<span class="t">Abmelden</span></button>`;
  const kopf = leiste({ kontext: f ? `${esc(f.logo)} ${esc(f.name)}` : "", badge: statusBadge(s), rechts });
  if (!s) return `${kopf}<main class="huelle">${ladeHinweis()}</main>`;
  if (!f) {
    if (!Object.keys(App.firmen).length) return `${kopf}<main class="huelle">${ladeHinweis()}</main>`;
    return `${kopf}<main class="huelle"><section class="karte stapel"><h2>Firma nicht gefunden</h2><p>Diese Firma gibt es in diesem Spiel nicht mehr.</p><div><button class="knopf" data-act="abmelden"><span>Zur Startseite</span></button></div></section></main>`;
  }
  const offen = s.status === "offen";
  const abgegeben = App.eigenerEntscheid && App.eigenerEntscheid.zeit && num(App.eigenerEntscheid.runde, s.runde) === s.runde;
  const reflexOffen = reflexionsTeile().some((t) => t.neu && !(((App.reflexion || {})[t.id] || {})[fid]));
  const tabs = [["zentrale", "🏠 Zentrale"], ["entscheiden", "📝 Entscheiden", offen && !abgegeben], ["bericht", "📊 Bericht"], ["rangliste", "🏆 Rangliste"], ["reflexion", "💬 Reflexion", reflexOffen], ["hilfe", "❓ Hilfe"]];
  const pane = { zentrale: gruppeZentrale, entscheiden: gruppeEntscheiden, bericht: gruppeBericht, rangliste: gruppeRangliste, reflexion: gruppeReflexion, hilfe: gruppeHilfe }[App.tabG] || gruppeZentrale;
  return `${kopf}<main class="huelle">
    ${lehrer ? `<div class="banner"><span>🎛️ Lehrpersonen-Ansicht von <b>${esc(f.logo + " " + f.name)}</b> – Eingaben werden für diese Gruppe gespeichert.</span><button class="knopf zweit klein" data-act="zurueckKontrollraum"><span>Zurück zum Kontrollraum</span></button></div>` : ""}
    ${tickerHtml()}${tabsHtml(tabs, App.tabG, "tabG")}<div class="stapel">${pane(f)}</div></main>`;
}

function statusKarteGruppe(f) {
  const s = App.spiel, abgegeben = App.eigenerEntscheid && App.eigenerEntscheid.zeit;
  if (s.status === "vorbereitung") return `<h2>🧭 Willkommen bei ${esc(f.name)}!</h2><p>Das Spiel startet bald. Löst in der Zwischenzeit den Start-Check und schaut euch eure Firma an.</p>`;
  if (s.status === "offen" && abgegeben && abgabeAusstehend()) return `<h2>📶 Abgabe wartet auf Verbindung</h2><p>Eure Entscheidungen für Quartal ${s.runde} sind auf diesem Gerät gespeichert und werden automatisch übertragen.</p>`;
  if (s.status === "offen") return abgegeben
    ? `<h2>✅ Abgegeben für Quartal ${s.runde}</h2><p>Bis zur Auswertung könnt ihr eure Entscheidungen noch ändern.</p><div><button class="knopf zweit" data-act="tabG" data-tab="entscheiden"><span>Entscheidungen ansehen</span></button></div>`
    : `<h2>📝 Quartal ${s.runde} ist offen!</h2><p>Level ${s.level}: ${esc(levelDaten(s.level).titel)}. Trefft jetzt eure Entscheidungen.</p><div><button class="knopf" data-act="tabG" data-tab="entscheiden"><span>Jetzt entscheiden →</span></button></div>`;

function kapazitaetMitPersonal(z, w, L, s) {
  const zz = Object.assign({}, z);
  if (L >= 3) zz.mitarbeitende = Math.max(1, z.mitarbeitende + klemme(Math.round(num(w.personal)), -(z.mitarbeitende - 1), R_().personalMaxPlus));
  if (L >= 5 && w.investAnlage === true) zz.anlageKauf = 1;
  return Engine.kapazitaetVon(zz, Engine.effekte(s.ereignisse));
}
// Planungshilfe: Kosten, Gewinnschwelle, Warnungen – live beim Tippen
function aktualisierePlanung() {
  const el = $("#planung");
  if (!el || !App.spiel) return;
  const s = App.spiel, r = R_(), L = s.level, fid = aktiveFirmaId();
  const z = zustandVor(fid, s.runde);
  const w = formularWerte();
  const d = Engine.normalisiere(w, L, z);
  const fx = Engine.effekte(s.ereignisse);
  const zz = Object.assign({}, z);
  zz.mitarbeitende = Math.max(1, z.mitarbeitende + d.personal);
  if (d.investAnlage) zz.anlageKauf = r.investitionen.anlage.preis;
  if (d.investSolar) zz.solarKauf = r.investitionen.solar.preis;
  const kap = Engine.kapazitaetVon(zz, fx);
  const menge = Math.min(d.menge, kap);
  const unit = Engine.stueckkostenVon(d, zz, fx, menge);
  const lohn = r.loehne[d.lohn];
  const personal = zz.mitarbeitende * lohn * 3 + Math.max(0, d.personal) * r.einstellungskosten + Math.max(0, -d.personal) * lohn;
  const herstellung = Math.round(menge * unit);
  const marketing = d.social + d.plakat + d.sponsoring;
  const kredit = Math.max(0, z.kredit + d.kreditNeu - d.kreditRueck);
  const zinsen = Math.round(kredit * r.kredit.zins);
  const abschreibung = (zz.anlageKauf ? Math.min(d.investAnlage ? zz.anlageKauf : z.anlage, Math.round(zz.anlageKauf / r.abschreibungQuartale)) : 0)
    + (zz.solarKauf ? Math.min(d.investSolar ? zz.solarKauf : z.solar, Math.round(zz.solarKauf / r.abschreibungQuartale)) : 0);
  const weitere = d.weiterbildung + d.lernende * r.lernende.kosten + d.engagement + zinsen + abschreibung;
  const total = herstellung + personal + marketing + r.fixkosten + weitere;
  const verfuegbar = z.lager + menge;
  const be = d.preis > 0 ? Math.ceil(total / d.preis) : 0;
  const maxGewinn = Math.round(Math.min(verfuegbar, 10 * r.basisNachfrage) * d.preis - total);
  const invest = (d.investAnlage ? r.investitionen.anlage.preis : 0) + (d.investSolar ? r.investitionen.solar.preis : 0);
  const pr0 = Engine.prognose(s.runde, s.ereignisse, s.einstellungen);
  const kasseErwartet = z.kasse + Math.min(verfuegbar, pr0.richtwert) * d.preis - (total - abschreibung) - invest + d.kreditNeu - d.kreditRueck;
  const pr = Engine.prognose(s.runde, s.ereignisse, s.einstellungen);
  const zeile = (a, b, cls) => `<span class="${cls || ""}">${a}</span><span class="z ${cls || ""}">${b}</span>`;
  el.innerHTML =
    zeile(`Kosten pro Dose`, preis(unit)) +
    zeile(`Herstellung (${fmt(menge)} × ${preis(unit)})`, fr(herstellung)) +
    zeile(`Löhne ${L >= 3 && d.personal ? "und Personalwechsel" : ""} (${zz.mitarbeitende} Personen)`, fr(personal)) +
    zeile(L >= 2 ? "Werbung" : "Werbung (Grundbudget)", fr(marketing)) +
    zeile("Fixkosten (Miete, Verwaltung)", fr(r.fixkosten)) +
    (weitere ? zeile("Weitere (Weiterbildung, Lernende, Engagement, Zins, Abschreibung)", fr(weitere)) : "") +
    zeile("<b>Geplante Kosten total</b>", `<b>${fr(total)}</b>`, "sum") +
    zeile("Angebot: Lager + Produktion", fmt(verfuegbar) + " Dosen") +
    zeile("<b>Gewinnschwelle</b> (Kosten ÷ Preis)", `<b>${fmt(be)} Dosen</b>`) +
    zeile("Gewinn, wenn ihr alles verkauft", fr(maxGewinn), maxGewinn >= 0 ? "pos" : "neg");
  const warn = [];
  if (d.menge > kap) warn.push(["schlecht", `🏭 Eure Kapazität reicht nur für ${fmt(kap)} Dosen. Mehr wird nicht produziert.`]);
  if (d.preis < unit) warn.push(["schlecht", `⚠️ Der Preis liegt unter den Kosten pro Dose (${preis(unit)}).`]);
  if (be > verfuegbar) warn.push(["schlecht", `📉 Selbst wenn ihr alles verkauft, deckt ihr die Kosten nicht: Gewinnschwelle ${fmt(be)} Dosen, Angebot ${fmt(verfuegbar)} Dosen.`]);
  else if (be > pr.richtwert * 1.1) warn.push(["achtung", `🤔 Die Gewinnschwelle (${fmt(be)} Dosen) liegt über der Prognose von rund ${fmt(pr.richtwert)} Dosen. Braucht eure Marke dafür mehr Kundschaft als eine durchschnittliche Firma?`]);
  if (verfuegbar > pr.richtwert * 1.4 && verfuegbar - pr.richtwert > r.lagerMax) warn.push(["achtung", `📦 Ihr bietet viel mehr an als die Prognose. Was nicht verkauft wird und nicht ins Lager passt (${fmt(r.lagerMax)}), wird verramscht.`]);
  if (kasseErwartet < 0) warn.push(["achtung", `🏦 Verkauft ihr ungefähr so viel wie die Prognose, reicht eure Kasse (${fr(z.kasse)}) nicht – dann springt die Bank mit einem teuren Notkredit ein.`]);
  if (L >= 3 && z.zufriedenheit < r.fluktuationUnter) warn.push(["schlecht", `🚪 Die Zufriedenheit ist unter ${r.fluktuationUnter}: Diesen Quartal kündigt eine Person. Höhere Löhne oder Weiterbildung helfen.`]);
  $("#planung-warnung").innerHTML = warn.map(([c, t]) => `<p class="hinweis ${c}">${t}</p>`).join("");
  const ph = $("#preis-anzeige"); if (ph) ph.textContent = preis(d.preis);
  const kh = $("#kap-hinweis"); if (kh) kh.textContent = `Kapazität: ${fmt(kap)} Dosen · im Lager: ${fmt(z.lager)} Dosen · Angebot total: ${fmt(verfuegbar)} Dosen`;
  const bh = $("#bekanntheit-hinweis");
  if (bh) { const b = Engine.bekanntheitNach(z.bekanntheit, d, fx); bh.innerHTML = `📣 Bekanntheit heute ${Math.round(z.bekanntheit)}% → mit diesem Budget rund <b>${Math.round(b)}%</b>`; }
}

// Ein Level gilt als abgeschlossen, wenn ein höheres gespielt wurde oder sein letztes Quartal ausgewertet ist
function levelAbgeschlossen(l) {
  const s = App.spiel;
  if (!s) return false;
  if (s.status === "beendet") return true;
  if (Object.values(s.verlauf).some((v) => v.level > l)) return true;
  return s.status === "ausgewertet" && s.level === l && (vorgeschlagenesLevel(s.runde + 1) !== l || s.runde >= 5 * s.einstellungen.rundenProLevel);
}

  const news = `${pr.saison.name ? `${pr.saison.ic} ${esc(pr.saison.name)} · ` : ""}Richtwert rund ${fmt(pr.richtwert)} Dosen pro Firma${evs.map((k) => `<br>${DATEN.ereignisse[k].ic} <b>${esc(DATEN.ereignisse[k].name)}:</b> ${esc(DATEN.ereignisse[k].text)}`).join("")}`;
  const feld = (t, h) => `<tr><td style="width:45%"><b>${t}</b>${h ? `<br><span class="klein">${h}</span>` : ""}</td><td class="linie"></td></tr>`;
  const blatt = `<div class="druckblatt"><h2>Voltage · Entscheidungsblatt Quartal ${n}</h2>
    <p>Spiel: ${esc(s.name)} · Level ${L}: ${esc(ld.titel)}</p>
    <p style="margin-top:6px">📰 ${news}</p>
    <table style="margin-top:10px"><tbody>
      ${feld("Firma", "")}
      ${feld("Produktionsmenge (Dosen)", `Kapazität zu Beginn: ${fmt(r.start.mitarbeitende * r.kapazitaetProPerson)} Dosen`)}
      ${feld("Verkaufspreis pro Dose (Fr.)", `${preis(r.preisMin)} bis ${preis(r.preisMax)}`)}
      ${L >= 2 ? feld("Social Media (Fr.)") + feld("Plakate & Kino (Fr.)") + feld("Sponsoring (Fr.)") : ""}
      ${L >= 3 ? feld("Personal einstellen (+) / entlassen (−)") + feld("Lohnniveau", "tief / branchenüblich / hoch") + feld("Weiterbildung (Fr.)") : ""}
      ${L >= 4 ? feld("Zutaten", "Standard / Bio & Fairtrade") + feld("Dose", "Standard / Recycling") + feld("Rezeptur", "normal / zuckerreduziert") : ""}
      ${L >= 5 ? feld("Investition", "keine / Abfüllanlage / Solaranlage") + feld("Kredit aufnehmen / zurückzahlen (Fr.)") + feld("Lernende (0–3)") + feld("Engagement (Fr.)") : ""}
      ${feld("Begründung in einem Satz", "")}
    </tbody></table></div>`;
  return blatt;
}
function klassenbericht() {
  const s = App.spiel, rl = rangliste(), runden = rundenListe(), last = runden[runden.length - 1];
  return `<div class="druckblatt"><h2>Voltage · ${esc(s.name)}</h2><p>Stand: ${esc(datumZeit(Date.now()))} · ${runden.length} Quartale gespielt</p>
    <h3 style="margin-top:12px">Rangliste</h3><table><thead><tr><th>#</th><th>Firma</th><th>Gesamt</th><th>Wirtschaft</th><th>Umwelt</th><th>Gesellschaft</th><th>Gewinn total</th></tr></thead><tbody>
    ${rl.map((e, i) => `<tr><td>${i + 1}</td><td>${esc(e.f.logo + " " + e.f.name)}</td><td>${e.wert}</td><td>${e.p.wirtschaft}</td><td>${e.p.umwelt}</td><td>${e.p.gesellschaft}</td><td>${fr(e.gewinnTotal)}</td></tr>`).join("")}
    </tbody></table>
    ${last ? `<h3 style="margin-top:12px">Quartal ${last}</h3><table><thead><tr><th>Firma</th><th>Preis</th><th>Verkauft</th><th>Anteil</th><th>Gewinn</th><th>Kasse</th></tr></thead><tbody>
    ${Object.entries(App.resultate[last].firmen).map(([fid, x]) => { const f = firmaVon(fid); return `<tr><td>${esc(f ? f.logo + " " + f.name : "(entfernt)")}</td><td>${num(x.entscheid.preis).toFixed(2)}</td><td>${fmt(x.verkauft)}</td><td>${x.marktanteil}%</td><td>${fr(x.gewinn)}</td><td>${fr(x.zustand.kasse)}</td></tr>`; }).join("")}

}

/* =========================================================================
   12. STEUERUNG – Klicks, Eingaben, Formulare
   ========================================================================= */
function feldWert(form, name) { const el = form.elements.namedItem(name); return el && "value" in el ? String(el.value) : ""; }

async function beitrittLaden(r) {
  const fR = await store(r.modus).lies(`spiele/${r.code}/firmen`);
  if (!fR.ok) { toast("⚠️ Keine Verbindung – bitte nochmals versuchen."); return; }
  App.beitritt = { code: r.code, modus: r.modus, spiel: r.spiel, firmen: firmenNormal(fR.daten), gewaehlt: null };
  App.bildschirm = "beitritt";
  zeichne();
}

const AKTIONEN = {
  nichts() {},
  start() { App.beitritt = null; App.bildschirm = "start"; zeichne(); window.scrollTo(0, 0); },
  thema() {
    const root = document.documentElement;
    const dunkel = root.dataset.theme === "dark" || (!root.dataset.theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.dataset.theme = dunkel ? "light" : "dark";
    Lokal.schreib("voltage:thema", root.dataset.theme);
    zeichne();
  },
  rolleGruppe() { App.beitritt = null; App.bildschirm = "beitritt"; zeichne(); const c = $("#beitritt-code"); if (c && !c.value) c.focus(); },
  rolleLehrer() { App.entwurf.lehrerWahl = null; App.bildschirm = "lehrerStart"; zeichne(); window.scrollTo(0, 0); },
  anleitung() { App.bildschirm = "anleitung"; zeichne(); window.scrollTo(0, 0); },
  demo: () => demoStarten(),
  lehrerNeu() { App.bildschirm = "lehrerNeu"; zeichne(); window.scrollTo(0, 0); },
  einrichten() { App.bildschirm = "einrichten"; zeichne(); window.scrollTo(0, 0); },
  onlineAus() { Lokal.loesche("voltage:firebaseUrl"); FirebaseDB.basis = onlineAdresse(); toast("Online-Modus ausgeschaltet"); zeichne(); },
  lehrerWahl(el) { App.entwurf.lehrerWahl = { code: el.dataset.code, modus: el.dataset.modus === "online" ? "online" : "lokal" }; zeichne(); const p = $("#ll-pin"); if (p) p.focus(); },
  async spielWaehlen(el) { const r = await spielSuchen(el.dataset.code); if (r.fehler) toast(r.fehler); else await beitrittLaden(r); },
  beitrittZurueck() { App.beitritt = null; zeichne(); },
  firmaWaehlen(el) { App.beitritt.gewaehlt = el.dataset.fid; zeichne(); const p = $("#login-pin"); if (p) p.focus(); },
  grLogo(el) {
    App.entwurf.gruendung.logo = el.dataset.wert;
    $$('[data-act="grLogo"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.wert === el.dataset.wert)));
  },
  grFarbe(el) {
    App.entwurf.gruendung.farbe = el.dataset.wert;
    $$('[data-act="grFarbe"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.wert === el.dataset.wert)));
  },
  async abmelden() {
    if (App.sitzung.rolle === "gruppe") {
      const ok = await frage({ titel: "Abmelden?", text: "Mit eurem PIN könnt ihr euch jederzeit wieder anmelden.", ja: "Abmelden" });
      if (!ok) return;
    }
    sitzungBeenden();
    App.bildschirm = "start";
    zeichne();
  },
  async aktualisieren() { await Abgleich.tick(true); zeichne(); toast("🔄 Aktualisiert"); },
  tabL(el) { App.tabL = el.dataset.tab; zeichne(); },
  tabG(el) { App.tabG = el.dataset.tab; zeichne(); },
  ereignis(el) {
    const plan = App.entwurf.runde || (App.entwurf.runde = { ereignisse: [] });
    const l = liste(plan.ereignisse), k = el.dataset.ev;
    if (l.includes(k)) plan.ereignisse = l.filter((x) => x !== k);
    else if (l.length >= 2) { toast("Höchstens zwei Ereignisse pro Quartal"); return; }
    else plan.ereignisse = l.concat(k);
    zeichne();
  },
  zufallsEreignis() {
    const s = App.spiel, n = s.status === "vorbereitung" ? 1 : s.runde + 1;
    const plan = App.entwurf.runde || (App.entwurf.runde = { ereignisse: [] });
    const level = num(plan.level, vorgeschlagenesLevel(n));
    const moeglich = Object.entries(DATEN.ereignisse).filter(([k, e]) => e.abLevel <= level && !liste(plan.ereignisse).includes(k)).map(([k]) => k);
    if (!moeglich.length) return;
    plan.ereignisse = [moeglich[Math.floor(Math.random() * moeglich.length)]];
    zeichne();
  },
  rundeOeffnen: () => rundeOeffnen(),
  auswerten: () => auswerten(),
  async auswertenFortsetzen() { if (await spielSchreiben({ status: "offen" })) { await Abgleich.tick(true); await auswerten(); } },
  async auswertungAbbrechen() { if (await spielSchreiben({ status: "offen" })) { toast("Quartal ist wieder offen"); await Abgleich.tick(true); } },
  auswertungZurueck: () => auswertungZuruecknehmen(),
  spielBeenden: () => spielBeenden(),
  spielFortsetzen: () => spielFortsetzen(),
  async alsGruppe(el) {
    App.sitzung.alsFirma = el.dataset.fid;
    sitzungSpeichern();
    App.eigenerEntscheid = undefined;
    App.tabG = App.spiel && App.spiel.status === "offen" ? "entscheiden" : "zentrale";
    App.bildschirm = "gruppe";
    await Abgleich.tick(true);
    zeichne();
    window.scrollTo(0, 0);
  },
  async zurueckKontrollraum() {
    App.sitzung.alsFirma = null;
    sitzungSpeichern();
    App.bildschirm = "lehrer";
    App.quiz = null;
    await Abgleich.tick(true);
    zeichne();
  },
  firmaLoeschen: (el) => firmaLoeschen(el.dataset.fid),
  pinZuruecksetzen: (el) => pinZuruecksetzen(el.dataset.fid),
  exportCsv: () => exportCsv(),
  exportReflexion: () => exportReflexion(),
  sicherung: () => sicherungHerunterladen(),
  spielLoeschen: () => spielLoeschen(),
  druckBlatt() { druckeHtml(entscheidungsblatt()); },
  druckKlasse() { druckeHtml(klassenbericht()); },
  drucken() { try { window.print(); } catch (e) { toast("Drucken ist in dieser Ansicht nicht möglich."); } },
  linkKopieren() { kopieren(klassenLink()); },
  ergebnisRunde(el) { App.ergebnisRunde = num(el.dataset.runde); zeichne(); },
  berichtRunde(el) { App.berichtRunde = num(el.dataset.runde); zeichne(); },
  schritt(el) {
    const feld = el.dataset.feld, d = num(el.dataset.d), input = $(`#e-${feld}`), w = formularWerte();
    let v = num(w[feld], 0) + d;
    if (input) v = klemme(v, num(input.min, 0), num(input.max, 500000));
    v = feld === "preis" ? Math.round(v * 100) / 100 : Math.round(v);
    w[feld] = v;
    if (input) input.value = v;
    entwurfMerken(); aktualisierePlanung();
  },
  option(el) {
    const feld = el.dataset.feld, w = formularWerte();
    let v = el.dataset.wert;
    if (v === "true") v = true; else if (v === "false") v = false;
    w[feld] = v;
    if (typeof v === "boolean") { el.setAttribute("aria-pressed", String(v)); el.dataset.wert = String(!v); }
    else $$(`[data-act="option"][data-feld="${feld}"]`).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.wert === String(v))));
    entwurfMerken(); aktualisierePlanung();
  },
  richtwert() {
    const s = App.spiel, z = zustandVor(aktiveFirmaId(), s.runde), pr = Engine.prognose(s.runde, s.ereignisse, s.einstellungen);
    const v = Math.max(0, Math.round((pr.richtwert - z.lager) / 500) * 500), w = formularWerte();
    w.menge = v;
    const i = $("#e-menge"); if (i) i.value = v;
    entwurfMerken(); aktualisierePlanung();
  },
  abgeben: () => entscheidAbgeben(),
  quizStart() { App.quiz = { index: 0, richtig: 0, antwort: null }; zeichne(); },
  quizAntwort(el) {
    const q = App.quiz; if (!q || q.antwort != null) return;
    q.antwort = num(el.dataset.i);
    if (q.antwort === DATEN.startcheck[q.index].richtig) q.richtig++;
    zeichne();
  },
  async quizWeiter() {
    const q = App.quiz; if (!q) return;
    q.index++; q.antwort = null;
    if (q.index >= DATEN.startcheck.length) await startcheckSpeichern(q.richtig, DATEN.startcheck.length);
    zeichne();
  },
  quizSchliessen() { App.quiz = null; zeichne(); }
};

const FORMULARE = {
  async spielcode(f) {
    const code = feldWert(f, "code");
    App.entwurf.beitrittCode = code;
    const r = await spielSuchen(code);
    if (r.fehler) { toast(r.fehler, 4500); return; }
    await beitrittLaden(r);
  },
  async gruppeLogin(f) {
    const b = App.beitritt, firma = b && b.firmen[b.gewaehlt];
    if (!firma) return;
    const frisch = await store(b.modus).lies(`spiele/${b.code}/firmen/${firma.id}/pinHash`);
    const soll = frisch.ok && typeof frisch.daten === "string" ? frisch.daten : firma.pinHash;
    if (pinHash(b.code, feldWert(f, "pin")) !== soll) { toast("❌ Der PIN stimmt nicht."); const p = $("#login-pin"); if (p) { p.value = ""; p.focus(); } return; }
    await gruppeOeffnen(b.code, b.modus, firma.id);
    toast(`👋 Willkommen zurück, ${firma.name}!`);
  },
  async gruenden(f) {
    const g = App.entwurf.gruendung;
    g.name = feldWert(f, "name"); g.pin = feldWert(f, "pin"); g.pin2 = feldWert(f, "pin2");
    const fehler = await firmaGruenden(g);
    if (fehler) toast(fehler, 4500);
  },
  async lehrerLogin(f) {
    const code = feldWert(f, "code").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const pin = feldWert(f, "pin");
    let modus = feldWert(f, "modus");
    if (!modus) { const r = await spielSuchen(code); if (r.fehler) { toast(r.fehler, 4500); return; } modus = r.modus; }
    const S = store(modus);
    const r = await S.lies(`lehrer/${code}/${pinHash(code, pin)}`);
    if (!r.ok) { toast("⚠️ Keine Verbindung zur Datenbank."); return; }
    if (r.daten !== true) { toast("❌ PIN oder Spielcode stimmt nicht."); const p = $("#ll-pin"); if (p) { p.value = ""; p.focus(); } return; }
    const sp = await S.lies(`spiele/${code}/spiel`);
    if (!sp.ok || !sp.daten) { toast("Dieses Spiel gibt es nicht mehr."); meineSpieleEntfernen(code); zeichne(); return; }
    const s = spielNormal(sp.daten);
    meineSpieleMerken({ code, name: s.name, modus, erstellt: s.erstellt, demo: s.demo || undefined });
    App.entwurf.lehrerWahl = null;
    App.tabL = "cockpit";
    await lehrerOeffnen(code, modus);
  },
  async spielNeu(f) {
    const pin = feldWert(f, "pin").trim(), pin2 = feldWert(f, "pin2").trim();
    if (pin.length < 4) { toast("Der PIN braucht mindestens 4 Zeichen."); return; }
    if (pin !== pin2) { toast("Die beiden PINs stimmen nicht überein."); return; }
    const e = await spielErstellen({
      name: feldWert(f, "name"), pin, modus: feldWert(f, "modus") || "lokal", startkapital: feldWert(f, "startkapital"),
      rundenProLevel: feldWert(f, "rundenProLevel"), ki: feldWert(f, "ki"), saison: feldWert(f, "saison") !== "nein",
      rangliste: feldWert(f, "rangliste"), wertung: feldWert(f, "wertung")
    });
    if (e.fehler) { toast("⚠️ " + e.fehler, 4500); return; }
    App.tabL = "cockpit";
    await lehrerOeffnen(e.code, e.modus);
    toast(`✅ Spiel erstellt – Spielcode ${e.code}`, 4500);
  },
  async einrichten(f) {
    const url = feldWert(f, "url").trim().replace(/\/+$/, "");
    const out = $("#fb-test");
    if (!gueltigeDbUrl(url)) { out.textContent = "❌ Das ist keine gültige Firebase-Adresse (endet auf firebasedatabase.app oder firebaseio.com)."; return; }
    out.textContent = "⏳ Teste die Verbindung …";
    const alt = FirebaseDB.basis;
    FirebaseDB.basis = url;
    const r = await FirebaseDB.lies("spiele/TESTXY/spiel");
    if (r.ok) {
      Lokal.schreib("voltage:firebaseUrl", url);
      out.textContent = "✅ Verbindung klappt. Der Online-Modus ist eingerichtet.";
      toast("🌐 Online-Modus eingerichtet");
      setTimeout(() => { App.bildschirm = "lehrerStart"; zeichne(); }, 1200);
    } else {
      FirebaseDB.basis = alt;
      out.textContent = r.status === 401 || r.status === 403 ? "❌ Zugriff verweigert. Sind die Regeln aus firebase/regeln.json eingespielt – mit «voltage» als oberstem Pfad?"
        : r.status === 404 ? "❌ Datenbank nicht gefunden – stimmt die Adresse?" : "❌ Keine Verbindung. Stimmt die Adresse, und ist das Gerät online?";
    }
  },
  entscheid() { /* Abgabe läuft über den Knopf */ },
  async reflexion(f) { await reflexionSpeichern(f.dataset.teil, f); }
};

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = AKTIONEN[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  if (el.dataset.laeuft) return;           // Doppelklick verhindern
  el.dataset.laeuft = "1";
  try { await fn(el, e); }
  catch (err) { console.error(err); toast("⚠️ Da ist etwas schiefgelaufen. Bitte nochmals versuchen."); }
  finally { delete el.dataset.laeuft; }
});
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const fn = FORMULARE[f.dataset.form];
  if (!fn || f.dataset.laeuft) return;
  f.dataset.laeuft = "1";
  const knopf = f.querySelector('[type="submit"]');
  if (knopf) knopf.disabled = true;
  try { await fn(f); }
  catch (err) { console.error(err); toast("⚠️ Da ist etwas schiefgelaufen. Bitte nochmals versuchen."); }
  finally { delete f.dataset.laeuft; if (knopf && knopf.isConnected) knopf.disabled = false; }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.feld && App.spiel && App.spiel.status === "offen" && aktiveFirmaId()) {
    const w = formularWerte();
    w[t.dataset.feld] = t.type === "number" || t.type === "range" ? (t.value === "" ? 0 : num(t.value, 0)) : t.value;
    entwurfMerken();
    aktualisierePlanung();
    return;
  }
  if (t.dataset.gr && App.entwurf.gruendung) { App.entwurf.gruendung[t.dataset.gr] = t.value; return; }
  if (t.dataset.frage != null && t.dataset.teil) { App.entwurf[reflexionsSchluessel(t.dataset.teil, t.dataset.frage)] = t.value; return; }
  if (t.id === "beitritt-code") App.entwurf.beitrittCode = t.value;
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.feld && t.type === "number" && App.spiel && aktiveFirmaId()) {
    const w = formularWerte();
    const v = klemme(Math.round(num(t.value, 0)), num(t.min, 0), num(t.max, 500000));
    w[t.dataset.feld] = v; t.value = v;
    entwurfMerken(); aktualisierePlanung();
    return;
  }
  if (t.dataset.plan) {
    const plan = App.entwurf.runde || (App.entwurf.runde = { ereignisse: [] });
    plan[t.dataset.plan] = num(t.value);
    t.blur();
    zeichne();
    return;
  }
  if (t.dataset.einst) {
    let v = t.value;
    if (v === "true") v = true; else if (v === "false") v = false; else if (/^\d+$/.test(v)) v = num(v);
    t.blur();
    await einstellungAendern(t.dataset.einst, v);
    return;
  }
  if (t.id === "sicherung-datei" && t.files && t.files[0]) { await sicherungEinspielen(t.files[0]); t.value = ""; }
});

/* =========================================================================
   13. START
   ========================================================================= */
function start() {
  const thema = Lokal.lies("voltage:thema", null);
  if (thema === "dark" || thema === "light") document.documentElement.dataset.theme = thema;
  FirebaseDB.basis = onlineAdresse();
  let params;
  try { params = new URLSearchParams(location.search); } catch (e) { params = new URLSearchParams(""); }
  const db = params.get("db");
  if (db && gueltigeDbUrl(db) && !gueltigeDbUrl(KONFIG.firebaseUrl)) {
    Lokal.schreib("voltage:firebaseUrl", db.trim().replace(/\/+$/, ""));
    FirebaseDB.basis = onlineAdresse();
  }
  const codeParam = (params.get("spiel") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const sl = Sitzungsspeicher.lies("voltage:sitzungL", null);
  const sg = Lokal.lies("voltage:sitzung", null);
  const modusOk = (m) => m !== "online" || !!onlineAdresse();
  if (sl && sl.rolle === "lehrer" && sl.code && modusOk(sl.modus) && (!codeParam || codeParam === sl.code)) {
    App.sitzung = { rolle: "lehrer", code: sl.code, fid: null, modus: sl.modus === "online" ? "online" : "lokal", alsFirma: sl.alsFirma || null };
    App.bildschirm = sl.alsFirma ? "gruppe" : "lehrer";
    zeichne();
    Abgleich.start();
  } else if (sg && sg.rolle === "gruppe" && sg.code && sg.fid && modusOk(sg.modus) && (!codeParam || codeParam === sg.code)) {
    App.sitzung = { rolle: "gruppe", code: sg.code, fid: sg.fid, modus: sg.modus === "online" ? "online" : "lokal", alsFirma: null };
    App.bildschirm = "gruppe";
    zeichne();
    Abgleich.start();
  } else if (codeParam) {
    App.bildschirm = "beitritt";
    App.entwurf.beitrittCode = codeParam;
    zeichne();
    spielSuchen(codeParam).then((r) => { if (r.fehler) toast(r.fehler, 4500); else beitrittLaden(r); });
  } else {
    App.bildschirm = "start";
    zeichne();
  }
  // Als App installierbar (nur über https, z.B. GitHub Pages)
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) { /* egal */ }
  }
}
start();
